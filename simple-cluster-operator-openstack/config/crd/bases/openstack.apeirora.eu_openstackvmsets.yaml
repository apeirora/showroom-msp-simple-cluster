---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openstackvmsets.openstack.apeirora.eu
spec:
  group: openstack.apeirora.eu
  names:
    kind: OpenStackVMSet
    listKind: OpenStackVMSetList
    plural: openstackvmsets
    shortNames:
    - osvms
    singular: openstackvmset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sshSecretRef.name
      name: SSH
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenStackVMSet requests a set of Nova servers, organised in groups,
          on the OpenStack cloud whose credentials live in CredentialsRef.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: OpenStackVMSetSpec describes a set of Nova servers to keep running.
            properties:
              credentialsRef:
                description: |-
                  CredentialsRef is a Secret in the same namespace carrying Keystone v3
                  application credentials. Required keys: OS_AUTH_URL, OS_REGION_NAME,
                  OS_APPLICATION_CREDENTIAL_ID, OS_APPLICATION_CREDENTIAL_SECRET.
                properties:
                  name:
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              network:
                description: Network is the name (or UUID) of the Neutron network each server gets a port on.
                minLength: 1
                type: string
              floatingIPPool:
                description: FloatingIPPool is the name (or UUID) of the external network from which floating IPs are allocated for groups that opt in.
                type: string
              securityGroups:
                description: SecurityGroups is the list of Neutron security-group names attached to every port. If empty the project default is used.
                items:
                  type: string
                type: array
              groups:
                description: |-
                  Groups is the list of node groups (e.g. control-plane, workers).
                  The operator ensures each group's `count` is reached.
                items:
                  description: VMGroup is one homogeneous pool of Nova servers.
                  properties:
                    name:
                      description: Name uniquely identifies the group inside this VMSet.
                      maxLength: 30
                      pattern: ^[a-z0-9][a-z0-9-]*$
                      type: string
                    count:
                      description: Count is how many servers this group should have running.
                      format: int32
                      maximum: 50
                      minimum: 0
                      type: integer
                    flavor:
                      description: Flavor is the Nova flavor name (e.g. "eo1a.medium").
                      minLength: 1
                      type: string
                    image:
                      description: Image is the Glance image name (e.g. "Ubuntu 24.04 LTS").
                      minLength: 1
                      type: string
                    floatingIP:
                      description: FloatingIP when true allocates one FIP from spec.floatingIPPool per server in this group.
                      type: boolean
                    userData:
                      description: UserData is cloud-init payload injected verbatim (already plain text — the operator base64-encodes it before calling Nova).
                      type: string
                  required:
                  - count
                  - flavor
                  - image
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - credentialsRef
            - groups
            - network
            type: object
          status:
            description: OpenStackVMSetStatus is the observed state of an OpenStackVMSet.
            properties:
              phase:
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              sshSecretRef:
                properties:
                  name:
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              keypairName:
                type: string
              groups:
                items:
                  properties:
                    name:
                      type: string
                    ready:
                      format: int32
                      type: integer
                    hosts:
                      items:
                        properties:
                          name:
                            type: string
                          id:
                            type: string
                          internalIP:
                            type: string
                          floatingIP:
                            type: string
                          status:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
