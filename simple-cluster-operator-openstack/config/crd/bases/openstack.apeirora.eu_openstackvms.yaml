---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackvms.openstack.apeirora.eu
spec:
  group: openstack.apeirora.eu
  names:
    kind: OpenStackVM
    listKind: OpenStackVMList
    plural: openstackvms
    singular: openstackvm
    shortNames:
      - osvm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.resolvedFlavor.flavor
          name: Flavor
          type: string
        - jsonPath: .status.internalAddress
          name: Internal
          type: string
        - jsonPath: .status.externalAddress
          name: External
          type: string
        - jsonPath: .status.sshSecretRef.name
          name: SSH
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          description: |-
            OpenStackVM requests one Nova server on the OpenStack cloud whose
            credentials live in CredentialsRef. The operator generates a per-VM
            ed25519 SSH keypair and publishes both the public key to Nova and
            the keypair to a Secret named `<vm-name>-ssh`.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - credentialsRef
                - network
                - resources
                - image
              properties:
                credentialsRef:
                  description: Secret in the same namespace carrying Keystone v3 application credentials.
                  type: object
                  properties:
                    name:
                      type: string
                      default: ""
                network:
                  description: Name or UUID of the Neutron network the server's port lives on.
                  type: string
                  minLength: 1
                floatingIPPool:
                  description: External network from which a FIP is allocated when `floatingIP=true`.
                  type: string
                securityGroups:
                  description: Neutron security-group names attached to the server's port.
                  type: array
                  items:
                    type: string
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      anyOf:
                        - type: integer
                        - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    memory:
                      anyOf:
                        - type: integer
                        - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    flavorPattern:
                      description: Go regex narrowing the flavor picker (e.g. `^eo[12]a\.`).
                      type: string
                image:
                  description: Glance image name (e.g. "Ubuntu 24.04 LTS").
                  type: string
                  minLength: 1
                floatingIP:
                  description: Allocate one FIP from `floatingIPPool` and attach it to the server's port.
                  type: boolean
                userData:
                  description: cloud-init payload injected verbatim (operator base64-encodes before Nova).
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Init
                    - Provisioning
                    - Ready
                    - Failed
                    - Deleting
                serverID:
                  type: string
                novaStatus:
                  type: string
                internalAddress:
                  type: string
                externalAddress:
                  type: string
                sshSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                      default: ""
                keypairName:
                  type: string
                resolvedFlavor:
                  type: object
                  properties:
                    flavor:
                      type: string
                    flavorDescription:
                      type: string
                    cpu:
                      type: integer
                      format: int32
                    memory:
                      type: string
                    image:
                      type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
