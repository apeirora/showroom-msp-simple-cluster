---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - openstack.apeirora.eu
  resources:
  - openstackvms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - openstack.apeirora.eu
  resources:
  - openstackvms/finalizers
  verbs:
  - update
- apiGroups:
  - openstack.apeirora.eu
  resources:
  - openstackvms/status
  verbs:
  - get
  - patch
  - update
