apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    app.kubernetes.io/name: kind-cluster-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: kind-cluster-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kind-cluster-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kind-cluster-operator
    spec:
      serviceAccountName: controller-manager
      # docker.sock on the host is typically root:docker (660). Running
      # the manager as root inside the pod is the simplest portable way
      # to read/write it; tighten via fsGroup if you have a known docker
      # GID on the host.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
          ports:
            - containerPort: 8081
              name: probe
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
