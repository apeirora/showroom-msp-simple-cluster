---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kind.apeirora.eu
  resources:
  - kindclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kind.apeirora.eu
  resources:
  - kindclusters/finalizers
  verbs:
  - update
- apiGroups:
  - kind.apeirora.eu
  resources:
  - kindclusters/status
  verbs:
  - get
  - patch
  - update
