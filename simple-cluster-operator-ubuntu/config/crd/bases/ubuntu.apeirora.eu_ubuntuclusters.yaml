---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: ubuntuclusters.ubuntu.apeirora.eu
spec:
  group: ubuntu.apeirora.eu
  names:
    kind: UbuntuCluster
    listKind: UbuntuClusterList
    plural: ubuntuclusters
    singular: ubuntucluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.cp
      name: CP
      type: string
    - jsonPath: .status.wkr
      name: WKR
      type: string
    - jsonPath: .status.k3sVersion
      name: K3s
      type: string
    - jsonPath: .status.kubeconfigSecretRef.name
      name: Kubeconfig
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UbuntuCluster installs k3s on a fleet of already-running Ubuntu hosts
          reached over SSH.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: UbuntuClusterSpec is the user request.
            properties:
              version:
                description: 'k3s release tag (e.g. "v1.31.4+k3s1"). Empty = installer default.'
                type: string
              controlPlaneEndpoint:
                description: |-
                  Public address (host or host:port) clients reach the kube-apiserver on.
                  When empty, the first control-plane host's address is used.
                type: string
              ssh:
                description: |-
                  SSH credential + login used to reach every host. Exactly one of
                  privateKeySecretRef or passwordSecretRef must be set.
                properties:
                  user:
                    description: Sudo-capable login.
                    minLength: 1
                    type: string
                  port:
                    description: SSH port. Defaults to 22.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  privateKeySecretRef:
                    description: Secret holding `ssh-privatekey`. Namespace is optional; defaults to the UbuntuCluster namespace.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  passwordSecretRef:
                    description: Secret holding `password`. Namespace is optional; defaults to the UbuntuCluster namespace.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - user
                type: object
                x-kubernetes-validations:
                - message: exactly one of privateKeySecretRef or passwordSecretRef
                    must be set
                  rule: has(self.privateKeySecretRef) != has(self.passwordSecretRef)
              controlPlane:
                description: Set of hosts that run `k3s server`.
                properties:
                  hosts:
                    items:
                      properties:
                        name:
                          maxLength: 63
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          type: string
                        address:
                          minLength: 1
                          type: string
                        externalAddress:
                          type: string
                        passwordSecretRef:
                          description: PasswordSecretRef overrides spec.ssh for this host with password login from a basic-auth Secret (`password`, optional `username`). Namespace is optional; defaults to the UbuntuCluster namespace.
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - address
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              workers:
                description: Set of hosts that run `k3s agent`. Optional.
                properties:
                  hosts:
                    items:
                      properties:
                        name:
                          maxLength: 63
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          type: string
                        address:
                          minLength: 1
                          type: string
                        externalAddress:
                          type: string
                        passwordSecretRef:
                          description: PasswordSecretRef overrides spec.ssh for this host with password login from a basic-auth Secret (`password`, optional `username`). Namespace is optional; defaults to the UbuntuCluster namespace.
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - address
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              k3sServerArgs:
                description: Extra args appended to `k3s server`.
                items:
                  maxLength: 512
                  type: string
                maxItems: 64
                type: array
              k3sAgentArgs:
                description: Extra args appended to `k3s agent`.
                items:
                  maxLength: 512
                  type: string
                maxItems: 64
                type: array
              encryption:
                description: |-
                  Encryption opts the cluster into encryption at rest of its Kubernetes
                  Secrets with an external KMS provider, from the first write. Every
                  control-plane host gets the KMS v2 plugin before k3s is installed on
                  it; a host that already runs k3s without the plugin is refused, never
                  silently accepted. Immutable: it can be neither added, removed nor
                  changed after creation. Mirrors SimpleCluster.spec.encryption.
                properties:
                  provider:
                    description: |-
                      Provider is the key management provider the kube-apiserver uses through
                      a KMS v2 plugin. Only Secrets are encrypted.
                    properties:
                      keyRotationPeriod:
                        description: |-
                          KeyRotationPeriod rotates the cluster's key automatically at this
                          interval (at least 1h). Unset means no automatic rotation. Data written
                          under older key versions stays readable.
                        type: string
                        x-kubernetes-validations:
                        - message: keyRotationPeriod must be at least 1h
                          rule: duration(self) >= duration('1h')
                      type:
                        description: Type of the provider.
                        enum:
                        - OpenBao
                        type: string
                    required:
                    - type
                    type: object
                required:
                - provider
                type: object
                x-kubernetes-validations:
                - message: encryption is immutable
                  rule: self == oldSelf
            required:
            - controlPlane
            - ssh
            type: object
            x-kubernetes-validations:
            - message: encryption cannot be added or removed after creation
              rule: has(self.encryption) == has(oldSelf.encryption)
            - message: k3s --secrets-encryption cannot be combined with spec.encryption
              rule: '!has(self.encryption) || !has(self.k3sServerArgs) || !self.k3sServerArgs.exists(a,
                a == ''--secrets-encryption'' || a.startsWith(''--secrets-encryption=''))'
          status:
            description: UbuntuClusterStatus is the observed state.
            properties:
              phase:
                enum:
                - Init
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              controlPlaneEndpoint:
                type: string
              k3sVersion:
                type: string
              kubeconfigSecretRef:
                properties:
                  name:
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              readyHosts:
                format: int32
                type: integer
              hosts:
                format: int32
                type: integer
              cp:
                type: string
              wkr:
                type: string
              hostStatuses:
                items:
                  properties:
                    name:
                      type: string
                    role:
                      type: string
                    address:
                      type: string
                    phase:
                      type: string
                    message:
                      type: string
                    kubeletVersion:
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              encryption:
                description: |-
                  Encryption reports the state of spec.encryption. Present only when
                  encryption is requested.
                properties:
                  cleanupDone:
                    description: |-
                      CleanupDone is true once the role and the hosts' secret IDs were
                      removed from the provider during deletion. The key is kept.
                    type: boolean
                  hosts:
                    description: Hosts lists each control-plane host's plugin state.
                    items:
                      description: HostEncryptionStatus is one control-plane host's
                        KMS plugin state.
                      properties:
                        name:
                          description: Name is the host name from spec.
                          type: string
                        secretIDAccessor:
                          description: |-
                            SecretIDAccessor identifies (without revealing) the AppRole secret ID
                            this host unwrapped. It is destroyed when the cluster is deleted.
                          type: string
                        secretIDIssuedAt:
                          description: |-
                            SecretIDIssuedAt is when the current secret ID was minted. The
                            operator replaces it before the role's secret ID TTL runs out.
                          format: date-time
                          type: string
                        verified:
                          description: |-
                            Verified is true once the host's kube-apiserver reported the
                            kms-providers check healthy with the plugin active.
                          type: boolean
                      required:
                      - name
                      - verified
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  keyName:
                    description: |-
                      KeyName is the Transit key the cluster encrypts with (the cluster's
                      own name). The key is kept when the cluster is deleted so that etcd
                      snapshots stay restorable; removing it is an OpenBao admin action.
                    type: string
                  keyVersion:
                    description: KeyVersion is the latest key version the provider
                      reported.
                    format: int64
                    type: integer
                  provider:
                    description: Provider echoes spec.encryption.provider.type.
                    enum:
                    - OpenBao
                    type: string
                  roleName:
                    description: RoleName is the AppRole role the hosts' plugins log
                      in with.
                    type: string
                required:
                - provider
                type: object
              message:
                description: |-
                  Message is a one-line summary of Phase for consumers that read a
                  scalar (the SimpleCluster default readiness check does).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
