# This rule is not used by the project sshkey-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sshkeys.apeirora.eu.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sshkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: sshkey-editor-role
rules:
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys/status
  verbs:
  - get
