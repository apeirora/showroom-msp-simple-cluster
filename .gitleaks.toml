# gitleaks configuration for the CI secret-scanning gate.
#
# Extends the default rule set and allowlists three classes of confirmed false
# positive, each verified by hand.

[extend]
useDefault = true

[[allowlists]]
description = """
SAP UI5 accessibility message-bundle keys in built front-end assets. These are
i18n identifiers, not credentials.
"""
paths = ['''(^|/)ui/dist/assets/messagebundle_.*\.js''']

[[allowlists]]
description = """
Sample Secret whose base64 payload decodes to the literal placeholder
'# Replace with your IronCore cluster kubeconfig'.
"""
paths = ['''samples/ironcore/ironcore-creds-secret\.yaml''']

[[allowlists]]
description = """
Placeholder key material in the sample Secrets. Real key material is neither
committed nor accepted here — see the samples' own instructions for generating a
throwaway keypair.
"""
regexes = [
  '''<PASTE YOUR OPENSSH (PRIVATE|PUBLIC) KEY HERE>''',
]

# The default rule set keys off well-known credential formats (AWS, GitHub,
# Slack, ...). Provider API tokens in the sample manifests are opaque strings
# that match none of them, so nothing stops a real one from being committed
# alongside an example. This rule covers that gap: under samples/, a
# credential-shaped key must carry a `<...>` placeholder, never a literal value.
[[rules]]
id = "sample-manifest-credential"
description = "Literal credential value in a sample manifest"
regex = '''(?im)^\s*(?:api[_-]?token|token|password|passwd|secret|access[_-]?key|secret[_-]?key|client[_-]?secret)\s*:\s*["']?[A-Za-z0-9._\-/+=]{12,}["']?\s*$'''
path = '''(^|/)samples/'''
