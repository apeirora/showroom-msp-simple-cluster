name: Publish Charts

# Single-version model: every chart is published at one version — the
# simple-cluster-operator release version — and that same version is stamped
# into each chart's `version`, `appVersion` and every operator image tag. This
# keeps charts and images in lockstep (chart X.Y.Z always pulls images X.Y.Z).
#
# Normally invoked by the Release Please workflow on an operator release. Can
# also be run manually (workflow_dispatch) to re-publish at an explicit version.
#
# Note: simple-cluster-scpc-config is NOT published from this repo — SCPC
# resources are now provided by the individual providers (e.g. datiprovider).
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to stamp into all charts (version, appVersion, image tags) and publish at."

permissions:
  contents: read
  packages: write

jobs:
  publish-charts:
    name: Package and publish Helm charts
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release version into operator image tags
        run: |
          set -euo pipefail
          yq -i ".global.imageTag = \"${VERSION}\"" charts/simple-cluster-system/values.yaml

      - name: Package and push charts at the release version
        run: |
          set -euo pipefail
          V="${VERSION}"
          # Chart paths relative to the repo root. The dati-provider charts live
          # under providers/ but publish in lockstep at the same release version.
          CHARTS=(
            charts/simple-cluster-system
            charts/ubuntu-machines-operator
            charts/sshkey-operator
            charts/bind-watcher-operator
            charts/arsys-ubuntu-machine-operator
            charts/simple-cluster-pm-integration
            charts/simple-cluster-ui
            charts/simple-cluster-sync-agent
            providers/showroom-msp-dati-provider/charts/datiprovider-operator
            providers/showroom-msp-dati-provider/charts/datiprovider-pm-integration
            providers/showroom-msp-dati-provider/charts/datiprovider-sync-agent
            providers/showroom-msp-dati-provider/charts/datiprovider-ui
          )
          mkdir -p .cr-release-packages
          for c in "${CHARTS[@]}"; do
            echo ">>> $c @ $V"
            # Resolve external deps (api-syncagent); umbrella sub-charts are vendored.
            helm dependency build "$c" || true
            helm package "$c" --version "$V" --app-version "$V" --destination .cr-release-packages
          done
          for pkg in .cr-release-packages/*.tgz; do
            echo ">>> push $pkg"
            helm push "$pkg" "$OCI_REPO"
          done
