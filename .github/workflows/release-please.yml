name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['simple-cluster-operator--release_created'] }}
      tag_name: ${{ steps.release.outputs['simple-cluster-operator--tag_name'] }}
      version: ${{ steps.release.outputs['simple-cluster-operator--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4.3.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish image (${{ matrix.image }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: simple-cluster-operator
            image: simple-cluster-operator
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-kind
            image: kind-cluster-operator
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-openstack
            image: simple-cluster-operator-openstack
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-ubuntu
            image: simple-cluster-operator-ubuntu
            platforms: linux/amd64,linux/arm64
          - context: ubuntu-machines
            image: ubuntu-machines
            platforms: linux/amd64,linux/arm64
          - context: ui
            image: simple-cluster-ui
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest

  # NOTE: Helm charts are published by .github/workflows/publish-charts.yml
  # (triggered on charts/** changes, at each chart's own Chart.yaml version),
  # not here — release-please is scoped to the simple-cluster-operator/ Go
  # package, so chart-only changes would never cut a release.
