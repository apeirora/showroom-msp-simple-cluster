name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['.--release_created'] }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] }}
      version: ${{ steps.release.outputs['.--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4.3.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish image (${{ matrix.image }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: simple-cluster-operator
            image: simple-cluster-operator
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-kind
            image: kind-cluster-operator
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-openstack
            image: simple-cluster-operator-openstack
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-ubuntu
            image: simple-cluster-operator-ubuntu
            platforms: linux/amd64,linux/arm64
          - context: simple-cluster-operator-ironcore
            image: simple-cluster-operator-ironcore
            platforms: linux/amd64,linux/arm64
          - context: ubuntu-machines
            image: ubuntu-machines
            platforms: linux/amd64,linux/arm64
          # arsys builds from the repo root: its go.mod has a
          # `replace => ../ubuntu-machines`, so the Dockerfile COPYs that sibling.
          - context: .
            dockerfile: simple-cluster-operator-arsys/Dockerfile
            image: arsys-ubuntu-machine-operator
            platforms: linux/amd64,linux/arm64
          - context: ui
            image: simple-cluster-ui
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest

  # Publish every chart at the operator release version, with that version
  # stamped into chart version/appVersion and all operator image tags — so
  # charts and images stay in lockstep. See publish-charts.yml.
  publish-charts:
    needs: [release-please, publish-images]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-charts.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
