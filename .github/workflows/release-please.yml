name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4.3.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and push every operator/UI image at the release version. Extracted
  # into a reusable workflow so it can also be re-run manually. See publish-images.yml.
  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # Publish every chart at the operator release version, with that version
  # stamped into chart version/appVersion and all operator image tags — so
  # charts and images stay in lockstep. See publish-charts.yml.
  publish-charts:
    needs: [release-please, publish-images]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-charts.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
