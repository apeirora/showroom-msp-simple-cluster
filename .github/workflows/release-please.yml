name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['simple-cluster-operator--release_created'] }}
      tag_name: ${{ steps.release.outputs['simple-cluster-operator--tag_name'] }}
      version: ${{ steps.release.outputs['simple-cluster-operator--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4.3.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build and publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple-cluster-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod
          cache: true
          cache-dependency-path: simple-cluster-operator/go.sum

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Docker image
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "Releasing $VERSION"
          make docker-publish VERSION=$VERSION

      - name: Generate install manifest
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: make build-installer IMG=ghcr.io/apeirora/simple-cluster-operator:$VERSION

      - name: Upload install manifest
        uses: actions/upload-artifact@v4
        with:
          name: install-manifest
          path: simple-cluster-operator/dist/install.yaml
