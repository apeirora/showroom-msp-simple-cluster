name: Publish

# Builds and pushes every operator/UI image and packages every Helm chart at one
# version — the simple-cluster-operator release version — with that version stamped
# into each chart's `version`, `appVersion` and every image tag. Charts are packaged
# only after their images exist, so a chart X.Y.Z always pulls images X.Y.Z.
#
# Normally invoked by the Release Please workflow on an operator release. Can also be
# run manually (workflow_dispatch) to re-publish at an explicit version.
#
# Note: simple-cluster-scpc-config is NOT published here — SCPC resources are now
# provided by the individual providers (e.g. datiprovider).
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to build/stamp into all images and charts and publish at (also tagged :latest)."

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ inputs.version }}
      # Pinned for the same reason hack/generate-sbom.sh pins it: syft's output
      # changes between releases, and the SBOM has to be reproducible.
      SYFT_VERSION: v1.51.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: simple-cluster-operator
            image: simple-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-kind
            image: kind-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-openstack
            image: simple-cluster-operator-openstack
            platforms: linux/amd64
          - context: simple-cluster-operator-ubuntu
            image: simple-cluster-operator-ubuntu
            platforms: linux/amd64
          - context: ubuntu-machines
            image: ubuntu-machines
            platforms: linux/amd64
          - context: sshkey-operator
            image: sshkey-operator
            platforms: linux/amd64
          - context: bind-watcher-operator
            image: bind-watcher-operator
            platforms: linux/amd64
          - context: ui
            image: simple-cluster-ui
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest

      # hack/generate-sbom.sh describes the source tree (go.mod / package-lock).
      # This one describes the runtime image, so the base layer's OS packages are
      # covered too. Both sets are attached to the release.
      - name: Generate the SBOM for the published image
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sbom-image
          docker run --rm -v "$PWD/sbom-image:/out" \
            -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME \
            -e SYFT_REGISTRY_AUTH_PASSWORD \
            "anchore/syft:${SYFT_VERSION}" \
            scan "registry:ghcr.io/apeirora/${IMAGE}:${VERSION}" \
              --source-name "${IMAGE}" --source-version "${VERSION}" \
              -o "cyclonedx-json=/out/${IMAGE}.image.cdx.json" \
              -o "spdx-json=/out/${IMAGE}.image.spdx.json"
          sudo chown -R "$(id -u):$(id -g)" sbom-image

      - name: Upload the image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image-${{ matrix.image }}-${{ inputs.version }}
          path: sbom-image/*.json

  publish-charts:
    name: Package and publish Helm charts
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release version into operator image tags
        run: |
          set -euo pipefail
          yq -i ".global.imageTag = \"${VERSION}\"" charts/simple-cluster-system/values.yaml

      - name: Package and push charts at the release version
        run: |
          set -euo pipefail
          V="${VERSION}"
          # Chart paths relative to the repo root. The cloud providers (dati, sap,
          # cloudferro, arsys) now live in their own repositories and publish there.
          # ubuntu-machines / sshkey / ubuntu / openstack stay here as the shared
          # compute operators those providers depend on at runtime.
          CHARTS=(
            charts/simple-cluster-system
            charts/ubuntu-machines-operator
            charts/sshkey-operator
            charts/bind-watcher-operator
            charts/simple-cluster-pm-integration
            charts/simple-cluster-ui
            charts/simple-cluster-sync-agent
          )
          mkdir -p .cr-release-packages
          for c in "${CHARTS[@]}"; do
            echo ">>> $c @ $V"
            # Resolve external deps (api-syncagent); umbrella sub-charts are vendored.
            helm dependency build "$c"
            helm package "$c" --version "$V" --app-version "$V" --destination .cr-release-packages
          done
          for pkg in .cr-release-packages/*.tgz; do
            echo ">>> push $pkg"
            helm push "$pkg" "$OCI_REPO"
          done

  publish-sbom:
    name: Regenerate and attach the SBOM
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod

      - name: Generate the SBOM set at the release version
        run: ./hack/generate-sbom.sh "${VERSION}"

      - name: Collect the per-image SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-image-*
          merge-multiple: true
          path: sbom

      - name: Upload the SBOM set as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.version }}
          path: sbom/*.json

      - name: Attach the SBOM set to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sbom/*.json --clobber
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Re-publishing an arbitrary version by hand: there may be no
            # release to attach to. The build artefact above still carries it.
            echo "::warning::no release $tag; the SBOM set is available as a build artefact only"
          else
            echo "::error::release $tag does not exist, cannot attach the SBOM set"
            exit 1
          fi

  publish-ocm:
    name: Publish the OCM component
    needs: [publish-images, publish-charts]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      OCM_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/ocm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the OCM CLI
        run: curl -sSfL https://ocm.software/install.sh | sudo bash

      - name: Build and push the component version
        run: |
          set -euo pipefail
          mkdir -p dist/ctf
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ocm add componentversions --create --file dist/ctf \
            .ocm/component-constructor.yaml \
            VERSION="${VERSION}" GITHUB_REPOSITORY_OWNER="${owner}"
          ocm transfer commontransportarchive dist/ctf "$OCM_REPOSITORY" \
            --copy-resources --overwrite
