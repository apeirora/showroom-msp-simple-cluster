name: Publish

# Builds and pushes every operator/UI image and packages every Helm chart at one
# version — the simple-cluster-operator release version — with that version stamped
# into each chart's `version`, `appVersion` and every image tag. Charts are packaged
# only after their images exist, so a chart X.Y.Z always pulls images X.Y.Z.
#
# Normally invoked by the Release Please workflow on an operator release. Can also be
# run manually (workflow_dispatch) to re-publish at an explicit version.
#
# Note: simple-cluster-scpc-config is NOT published here — SCPC resources are now
# provided by the individual providers (e.g. datiprovider).
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to build/stamp into all images and charts and publish at (also tagged :latest)."

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: simple-cluster-operator
            image: simple-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-kind
            image: kind-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-openstack
            image: simple-cluster-operator-openstack
            platforms: linux/amd64
          - context: simple-cluster-operator-ubuntu
            image: simple-cluster-operator-ubuntu
            platforms: linux/amd64
          - context: simple-cluster-operator-ironcore
            image: simple-cluster-operator-ironcore
            platforms: linux/amd64
          - context: ubuntu-machines
            image: ubuntu-machines
            platforms: linux/amd64
          - context: sshkey-operator
            image: sshkey-operator
            platforms: linux/amd64
          - context: bind-watcher-operator
            image: bind-watcher-operator
            platforms: linux/amd64
          # arsys builds from the repo root: its go.mod has a
          # `replace => ../ubuntu-machines`, so the Dockerfile COPYs that sibling.
          - context: .
            dockerfile: simple-cluster-operator-arsys/Dockerfile
            image: arsys-ubuntu-machine-operator
            platforms: linux/amd64
          - context: ui
            image: simple-cluster-ui
            platforms: linux/amd64
          - context: providers/showroom-msp-dati-provider
            image: dati-provider-operator
            platforms: linux/amd64
          - context: providers/showroom-msp-dati-provider/ui
            image: datiprovider-ui
            platforms: linux/amd64
          - context: providers/showroom-msp-sap-provider
            image: sap-provider-operator
            platforms: linux/amd64
          - context: providers/showroom-msp-sap-provider/ui
            image: sapprovider-ui
            platforms: linux/amd64
          - context: providers/showroom-msp-cloudferro-provider
            image: cloudferro-provider-operator
            platforms: linux/amd64
          - context: providers/showroom-msp-arsys-provider
            image: arsys-provider-operator
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest

  publish-charts:
    name: Package and publish Helm charts
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release version into operator image tags
        run: |
          set -euo pipefail
          yq -i ".global.imageTag = \"${VERSION}\"" charts/simple-cluster-system/values.yaml

      - name: Package and push charts at the release version
        run: |
          set -euo pipefail
          V="${VERSION}"
          # Chart paths relative to the repo root. The dati-provider charts live
          # under providers/ but publish in lockstep at the same release version.
          CHARTS=(
            charts/simple-cluster-system
            charts/ubuntu-machines-operator
            charts/sshkey-operator
            charts/bind-watcher-operator
            charts/arsys-ubuntu-machine-operator
            charts/simple-cluster-pm-integration
            charts/simple-cluster-ui
            charts/simple-cluster-sync-agent
            providers/showroom-msp-dati-provider/charts/datiprovider-operator
            providers/showroom-msp-dati-provider/charts/datiprovider-pm-integration
            providers/showroom-msp-dati-provider/charts/datiprovider-sync-agent
            providers/showroom-msp-dati-provider/charts/datiprovider-ui
            providers/showroom-msp-sap-provider/charts/sapprovider-operator
            providers/showroom-msp-sap-provider/charts/sapprovider-pm-integration
            providers/showroom-msp-sap-provider/charts/sapprovider-sync-agent
            providers/showroom-msp-sap-provider/charts/sapprovider-ui
            providers/showroom-msp-cloudferro-provider/charts/cloudferroprovider-operator
            providers/showroom-msp-cloudferro-provider/charts/cloudferroprovider-pm-integration
            providers/showroom-msp-cloudferro-provider/charts/cloudferroprovider-sync-agent
            providers/showroom-msp-arsys-provider/charts/arsysprovider-operator
            providers/showroom-msp-arsys-provider/charts/arsysprovider-pm-integration
            providers/showroom-msp-arsys-provider/charts/arsysprovider-sync-agent
          )
          mkdir -p .cr-release-packages
          for c in "${CHARTS[@]}"; do
            echo ">>> $c @ $V"
            # Resolve external deps (api-syncagent); umbrella sub-charts are vendored.
            helm dependency build "$c" || true
            helm package "$c" --version "$V" --app-version "$V" --destination .cr-release-packages
          done
          for pkg in .cr-release-packages/*.tgz; do
            echo ">>> push $pkg"
            helm push "$pkg" "$OCI_REPO"
          done
