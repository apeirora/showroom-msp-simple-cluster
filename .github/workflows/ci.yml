name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    working-directory: simple-cluster-operator

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod
          cache: true
          cache-dependency-path: simple-cluster-operator/go.sum

      - name: Build
        run: make build

      # The admission-policy test renders the guard from charts/simple-cluster-system
      # and skips itself when helm is missing.
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test
        run: make test

  build-sshkey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sshkey-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sshkey-operator/go.mod
          cache: true
          cache-dependency-path: sshkey-operator/go.sum

      - name: Build
        run: make build

      - name: Test
        run: make test

  build-bind-watcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bind-watcher-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bind-watcher-operator/go.mod
          cache: true
          cache-dependency-path: bind-watcher-operator/go.sum

      - name: Build
        run: make build

      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod
          cache: true
          cache-dependency-path: simple-cluster-operator/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: simple-cluster-operator
