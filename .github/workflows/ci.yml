name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- Go modules
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - sshkey-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  # ------------------------------------------------------------------------ UI
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test ORD renderer
        run: npm run test:ord

      - name: Build
        run: npm run build

  # -------------------------------------------------------------- Helm charts
  helm:
    name: Helm (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - bind-watcher-operator
          - simple-cluster-pm-integration
          - simple-cluster-scpc-config
          - simple-cluster-sync-agent
          - simple-cluster-system
          - simple-cluster-ui
          - sshkey-operator
          - ubuntu-machines-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint, template and package chart
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          helm dependency update "$chart_dir"
          helm lint "$chart_dir"
          helm template "ci-${{ matrix.chart }}" "$chart_dir" --namespace default >/dev/null
          helm package "$chart_dir" --destination "dist/${{ matrix.chart }}"

  charts-ord:
    name: Helm (ORD wiring)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test ORD chart wiring
        run: bash hack/test-ord-charts.sh

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod
          cache: true
          cache-dependency-path: simple-cluster-operator/go.sum

      - name: Regenerate API code and CRDs
        working-directory: simple-cluster-operator
        run: make generate manifests

      - name: Verify shipped SimpleCluster CRDs match generated schemas
        run: bash hack/check-simple-cluster-crd-sync.sh

      - name: Verify generated files are current
        run: |
          git diff --exit-code -- \
            simple-cluster-operator/api/v1alpha1/zz_generated.deepcopy.go \
            simple-cluster-operator/config/crd/bases

  # ---------------------------------------------------------- Compliance gates
  reuse:
    name: Gate — REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: REUSE lint
        uses: fsfe/reuse-action@v5

  secrets:
    name: Gate — Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Run gitleaks directly rather than through gitleaks-action: the action
      # requires a GITLEAKS_LICENSE secret for organisation-owned repositories,
      # and pinning the image keeps a new upstream release from turning this
      # gate red on an unrelated pull request.
      #
      # Scans the tree, which is what a per-change gate should do.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            dir /repo --config /repo/.gitleaks.toml --redact

  vulnerabilities:
    name: Gate — Vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  vulnerabilities-ui:
    name: Gate — Vulnerabilities (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Gate — Dependency licences
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod

      - name: Check the SBOM and licence audit are current
        run: bash hack/check-sbom-current.sh

  # ------------------------------------------------------- Required-check hub
  # A branch ruleset can only require a status check by its exact context name,
  # which for a matrix job means one context per leg — brittle whenever a module
  # or chart is added. This job depends on every other one and fails unless they
  # all succeeded, so the ruleset needs exactly one required check:
  #
  #     Required checks
  #
  # Adding a module or a chart then extends coverage automatically, with no
  # ruleset change and no chance of a mistyped context silently never reporting.
  required:
    name: Required checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go
      - lint
      - ui
      - helm
      - charts-ord
      - generated
      - reuse
      - secrets
      - vulnerabilities
      - vulnerabilities-ui
      - dependencies
    steps:
      - name: Report the result of every required job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          # Never pass on an empty result set: a gate that fails open is worse
          # than no gate, because the ruleset reports it green.
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::no job results were reported"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
