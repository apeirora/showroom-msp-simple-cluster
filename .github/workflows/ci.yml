name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- Go modules
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Modules carrying a golangci-lint configuration.
        module:
          - simple-cluster-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: ${{ matrix.module }}

  # ------------------------------------------------------------------------ UI
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test ORD renderer
        run: npm run test:ord

      - name: Build
        run: npm run build

  # -------------------------------------------------------------- Helm charts
  helm:
    name: Helm (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - bind-watcher-operator
          - simple-cluster-pm-integration
          - simple-cluster-scpc-config
          - simple-cluster-sync-agent
          - simple-cluster-system
          - simple-cluster-ui
          - sshkey-operator
          - ubuntu-machines-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint, template and package chart
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          helm dependency update "$chart_dir"
          helm lint "$chart_dir"
          helm template "ci-${{ matrix.chart }}" "$chart_dir" --namespace default >/dev/null
          helm package "$chart_dir" --destination "dist/${{ matrix.chart }}"

  charts-ord:
    name: Helm (ORD wiring)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test ORD chart wiring
        run: bash hack/test-ord-charts.sh

  # ---------------------------------------------------------- Compliance gates
  reuse:
    name: Gate — REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: REUSE lint
        uses: fsfe/reuse-action@v5

  secrets:
    name: Gate — Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # gitleaks needs the history to scan a pull request's commits.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  vulnerabilities:
    name: Gate — Vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vulnerabilities-ui:
    name: Gate — Vulnerabilities (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Gate — Dependency licences
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simple-cluster-operator/go.mod

      - name: Check the SBOM and licence audit are current
        run: bash hack/check-sbom-current.sh
