name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- Go modules
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - sshkey-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  # ------------------------------------------------------------------------ UI
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test account context and resource views
        run: npm test

      - name: Test ORD renderer
        run: npm run test:ord

      - name: Build
        run: npm run build

  # -------------------------------------------------------------- Helm charts
  helm:
    name: Helm (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - bind-watcher-operator
          - simple-cluster-pm-integration
          - simple-cluster-scpc-config
          - simple-cluster-sync-agent
          - simple-cluster-system
          - simple-cluster-ui
          - sshkey-operator
          - ubuntu-machines-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint, template and package chart
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          helm dependency update "$chart_dir"
          helm lint "$chart_dir"
          helm template "ci-${{ matrix.chart }}" "$chart_dir" --namespace default >/dev/null
          helm package "$chart_dir" --destination "dist/${{ matrix.chart }}"

  chart-crds:
    # helm lint/template cannot see what the apiserver checks at install time
    # (CEL cost budget, structural schema rules). Render every chart that ships
    # CRDs and install them into a real kube-apiserver of the Kubernetes minor
    # the MSP clusters run. Release 0.43.0 was rejected by both clusters while
    # this workflow was green; see hack/crdcheck.
    name: Helm (CRDs install on Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.34"
    env:
      CHARTS_WITH_CRDS: simple-cluster-system ubuntu-machines-operator sshkey-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: hack/crdcheck/go.mod
          cache-dependency-path: hack/crdcheck/go.sum

      - name: Render the charts that ship CRDs
        run: |
          set -euo pipefail
          for chart in $CHARTS_WITH_CRDS; do
            mkdir -p "rendered/$chart"
            helm template crdcheck "charts/$chart" --namespace simple-cluster-system > "rendered/$chart/all.yaml"
            echo "$chart: $(grep -c '^kind: CustomResourceDefinition' "rendered/$chart/all.yaml") CRDs"
          done

      - name: Install the rendered CRDs into a kube-apiserver
        run: |
          set -euo pipefail
          assets="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25 use ${{ matrix.k8s }} --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          for chart in $CHARTS_WITH_CRDS; do
            echo "== $chart"
            go run -C hack/crdcheck . "$assets" "$GITHUB_WORKSPACE/rendered/$chart"
          done

  charts-ord:
    name: Helm (ORD wiring)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Go for credential chart tests
        uses: actions/setup-go@v7
        with:
          go-version-file: bind-watcher-operator/go.mod
          cache-dependency-path: bind-watcher-operator/go.sum

      - name: Test KCP credential chart mounts
        working-directory: bind-watcher-operator
        run: go test ./internal/charttests

      - name: Test ORD chart wiring
        run: bash hack/test-ord-charts.sh

  # ---------------------------------------------------------- Compliance gates
  reuse:
    name: Gate — REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: REUSE lint
        uses: fsfe/reuse-action@v6

  secrets:
    name: Gate — Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Run gitleaks directly rather than through gitleaks-action: the action
      # requires a GITLEAKS_LICENSE secret for organisation-owned repositories,
      # and pinning the image keeps a new upstream release from turning this
      # gate red on an unrelated pull request.
      #
      # Scans the tree, which is what a per-change gate should do.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            dir /repo --config /repo/.gitleaks.toml --redact

  vulnerabilities:
    name: Gate — Vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - simple-cluster-operator
          - simple-cluster-operator-kind
          - simple-cluster-operator-openstack
          - simple-cluster-operator-ubuntu
          - ubuntu-machines
          - sshkey-operator
          - bind-watcher-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  vulnerabilities-ui:
    name: Gate — Vulnerabilities (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Gate — Dependency licences
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: simple-cluster-operator/go.mod

      - name: Test SBOM freshness validation
        run: python3 -m unittest discover -s hack/tests -p 'test_sbom_current.py'

      - name: Check the SBOM and licence audit are current
        run: bash hack/check-sbom-current.sh

  # ------------------------------------------------------- Required-check hub
  # A branch ruleset can only require a status check by its exact context name,
  # which for a matrix job means one context per leg — brittle whenever a module
  # or chart is added. This job depends on every other one and fails unless they
  # all succeeded, so the ruleset needs exactly one required check:
  #
  #     Required checks
  #
  # Adding a module or a chart then extends coverage automatically, with no
  # ruleset change and no chance of a mistyped context silently never reporting.
  required:
    name: Required checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go
      - lint
      - ui
      - helm
      - chart-crds
      - charts-ord
      - reuse
      - secrets
      - vulnerabilities
      - vulnerabilities-ui
      - dependencies
    steps:
      - name: Report the result of every required job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          # Never pass on an empty result set: a gate that fails open is worse
          # than no gate, because the ruleset reports it green.
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::no job results were reported"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
