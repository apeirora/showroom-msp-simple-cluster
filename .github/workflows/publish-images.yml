name: Publish Images

# Builds and pushes every operator/UI image at one version. Normally invoked by
# the Release Please workflow on an operator release; can also be run manually
# (workflow_dispatch) to re-publish images at an explicit version.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to build and push all images at (also tagged :latest)."

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: simple-cluster-operator
            image: simple-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-kind
            image: kind-cluster-operator
            platforms: linux/amd64
          - context: simple-cluster-operator-openstack
            image: simple-cluster-operator-openstack
            platforms: linux/amd64
          - context: simple-cluster-operator-ubuntu
            image: simple-cluster-operator-ubuntu
            platforms: linux/amd64
          - context: simple-cluster-operator-ironcore
            image: simple-cluster-operator-ironcore
            platforms: linux/amd64
          - context: ubuntu-machines
            image: ubuntu-machines
            platforms: linux/amd64
          - context: sshkey-operator
            image: sshkey-operator
            platforms: linux/amd64
          - context: bind-watcher-operator
            image: bind-watcher-operator
            platforms: linux/amd64
          # arsys builds from the repo root: its go.mod has a
          # `replace => ../ubuntu-machines`, so the Dockerfile COPYs that sibling.
          - context: .
            dockerfile: simple-cluster-operator-arsys/Dockerfile
            image: arsys-ubuntu-machine-operator
            platforms: linux/amd64
          - context: ui
            image: simple-cluster-ui
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/apeirora/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/apeirora/${{ matrix.image }}:latest
