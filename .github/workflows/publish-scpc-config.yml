name: Publish scpc-config Chart

on:
  push:
    branches:
      - main
    paths:
      - charts/simple-cluster-scpc-config/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package and publish scpc-config
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      CHART_DIR: charts/simple-cluster-scpc-config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push at Chart.yaml version
        run: |
          set -euo pipefail
          V="$(helm show chart "$CHART_DIR" | yq '.version')"
          if helm show chart "$OCI_REPO/simple-cluster-scpc-config" --version "$V" >/dev/null 2>&1; then
            echo "simple-cluster-scpc-config $V already published — bump Chart.yaml version to release a new one."
            exit 0
          fi
          mkdir -p .cr-release-packages
          helm package "$CHART_DIR" --destination .cr-release-packages
          helm push .cr-release-packages/*.tgz "$OCI_REPO"
