name: Publish dati-provider

# Publishes the dati.gardener provider — one operator image plus its three Helm
# charts — at a single version (image tag == chart version == appVersion). The
# dati provider carries its own version line, independent of the simple-cluster
# operator lockstep. Runs on any change under the provider dir on main, or
# manually with an explicit version override.
on:
  push:
    branches:
      - main
    paths:
      - providers/showroom-msp-dati-provider/**
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build/publish at (default: datiprovider-operator Chart.yaml version)."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  PROVIDER_DIR: providers/showroom-msp-dati-provider

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Determine version
        id: v
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V="$(yq '.version' "$PROVIDER_DIR/charts/datiprovider-operator/Chart.yaml")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing dati-provider at $V"

  publish-image:
    name: Publish operator image
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROVIDER_DIR }}
          file: ${{ env.PROVIDER_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/apeirora/dati-provider-operator:${{ needs.resolve-version.outputs.version }}
            ghcr.io/apeirora/dati-provider-operator:latest

  publish-charts:
    name: Publish Helm charts
    needs:
      - resolve-version
      - publish-image
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/apeirora/charts
      V: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Log in to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push charts at the resolved version
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for c in datiprovider-operator datiprovider-pm-integration datiprovider-sync-agent; do
            if helm show chart "$OCI_REPO/$c" --version "$V" >/dev/null 2>&1; then
              echo ">>> $c $V already published — skipping"
              continue
            fi
            echo ">>> package $c @ $V"
            # Resolve the api-syncagent dependency (vendored under charts/); tolerate
            # an already-built lock so a fresh checkout still packages.
            helm dependency build "$PROVIDER_DIR/charts/$c" || true
            helm package "$PROVIDER_DIR/charts/$c" --version "$V" --app-version "$V" --destination .cr-release-packages
          done
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            echo ">>> push $pkg"
            helm push "$pkg" "$OCI_REPO"
          done
