name: OpenBao KMS e2e

on:
  push:
    branches:
      - main
    paths:
      - hack/openbao-kms/**
      - .github/workflows/openbao-kms-e2e.yml
  pull_request:
    branches:
      - main
    paths:
      - hack/openbao-kms/**
      - .github/workflows/openbao-kms-e2e.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: OpenBao KMS e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -S warning hack/openbao-kms/*.sh

      - name: End-to-end test
        run: hack/openbao-kms/e2e-local.sh
