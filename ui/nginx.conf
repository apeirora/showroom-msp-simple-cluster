server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS lets the portal load public UI configuration and ORD documents.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;

    location = /pm-content.json {
        default_type application/json;
        try_files /pm-content.json =404;
    }

    location = /simple-cluster-config.json {
        default_type application/json;
        try_files /simple-cluster-config.json =404;
    }

    location = /.well-known/open-resource-discovery {
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files /ord/configuration.json =404;
    }

    location ^~ /ord/ {
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
