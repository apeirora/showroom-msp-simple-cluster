---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: ironcorevms.ironcore.apeirora.eu
spec:
  group: ironcore.apeirora.eu
  names:
    kind: IronCoreVM
    listKind: IronCoreVMList
    plural: ironcorevms
    shortNames:
    - icvm
    singular: ironcorevm
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.resolvedMachineClass.name
      name: Class
      type: string
    - jsonPath: .status.internalAddress
      name: Internal
      type: string
    - jsonPath: .status.externalAddress
      name: External
      type: string
    - jsonPath: .status.sshSecretRef.name
      name: SSH
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IronCoreVM requests one IronCore Machine. The operator generates a per-VM
          ed25519 SSH keypair, injects it via ignition, and exposes the machine's
          addresses in status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IronCoreVMSpec describes one IronCore Machine.
            properties:
              cloudProfile:
                description: |-
                  CloudProfile selects an IronCore MachineClass by name directly
                  (e.g. "memory-intel1-2cpu"), the same name as the matching Gardener
                  CloudProfile machineType. Mutually exclusive with Resources.
                type: string
              image:
                description: |-
                  Image is the OCI reference for the boot image
                  (e.g. ghcr.io/ironcore-dev/gardenlinux:latest).
                minLength: 1
                type: string
              ipPool:
                description: |-
                  IPPool, when set, is an existing ipam Prefix the NIC allocates its /32 from.
                  When empty, the operator creates a root Prefix named after Network using
                  NetworkCIDR and allocates from that.
                type: string
              ironcoreKubeconfig:
                description: |-
                  IronCoreKubeconfig references a Secret carrying a kubeconfig for the IronCore
                  cluster under key `kubeconfig`. Set `namespace` to read the Secret from a
                  different namespace; when empty it defaults to the VM's namespace.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              ironcoreNamespace:
                description: |-
                  IronCoreNamespace is the namespace in the IronCore cluster where resources
                  are created. When empty it defaults to the namespace set in the credentials
                  kubeconfig context, else "default".
                type: string
              machinePool:
                description: |-
                  MachinePool sets the MachinePoolRef on the Machine. Empty means the
                  IronCore scheduler picks a pool.
                type: string
              network:
                description: Network is the IronCore Network name. The operator ensures
                  it exists.
                minLength: 1
                type: string
              networkCIDR:
                default: 10.0.0.0/24
                description: |-
                  NetworkCIDR is the CIDR of the root Prefix the operator creates for Network
                  when IPPool is unset.
                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                type: string
              publicIP:
                description: PublicIP, when true, attaches a Public VirtualIP to the
                  NetworkInterface.
                type: boolean
              resources:
                description: |-
                  Resources defines the CPU/memory floor; the operator picks the smallest
                  MachineClass that satisfies it. Mutually exclusive with CloudProfile.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the minimum CPU count (e.g. "2" or "1500m").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  machineClassPattern:
                    description: |-
                      MachineClassPattern narrows selection to MachineClass names matching this
                      Go regex.
                    type: string
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the minimum RAM (e.g. "4Gi").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cpu
                - memory
                type: object
              sshKeyRef:
                description: |-
                  SSHKeyRef selects the SSH key material for the VM. It accepts either an
                  SSHKey custom resource (apiGroup sshkeys.apeirora.eu, kind SSHKey) — whose
                  public key is read directly — or a kubernetes.io/ssh-auth Secret (core
                  apiGroup, kind Secret) whose ssh-publickey is used (looked up, or generated
                  and stored when absent). namespace is optional and defaults to the VM's
                  namespace. When unset, a per-VM Secret `<vm-name>-ssh` is generated.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      If APIGroup is not specified, the specified Kind must be in the core API group.
                      For any other third-party types, APIGroup is required.
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of resource being referenced
                      Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                      (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                    type: string
                required:
                - kind
                - name
                type: object
              sshUser:
                default: root
                description: SSHUser is the OS user the SSH key is injected for via
                  ignition.
                type: string
              userData:
                description: UserData is extra payload written as a file + oneshot
                  systemd unit via ignition.
                type: string
            required:
            - image
            - ironcoreKubeconfig
            - network
            type: object
            x-kubernetes-validations:
            - message: set exactly one of spec.cloudProfile or spec.resources
              rule: has(self.cloudProfile) != has(self.resources)
          status:
            description: IronCoreVMStatus is the observed state of one IronCore Machine.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalAddress:
                description: ExternalAddress is the VirtualIP from NetworkInterface.status.virtualIP.
                type: string
              internalAddress:
                description: InternalAddress is the IP from NetworkInterface.status.ips[0].
                type: string
              machineID:
                description: MachineID is the provider-internal Machine ID.
                type: string
              machineState:
                description: MachineState mirrors Machine.status.state.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the coarse state.
                enum:
                - Init
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              resolvedMachineClass:
                description: ResolvedMachineClass is the MachineClass the operator
                  picked.
                properties:
                  cpu:
                    description: CPU is the MachineClass cpu capability as integer
                      cores.
                    format: int32
                    type: integer
                  description:
                    description: Description is a one-line summary (cpu / memory).
                    type: string
                  image:
                    description: Image mirrors spec.image.
                    type: string
                  memory:
                    description: Memory is the MachineClass memory capability as a
                      human-readable size.
                    type: string
                  name:
                    description: Name is the MachineClass name.
                    type: string
                type: object
              sshSecretRef:
                description: |-
                  SSHSecretRef references the Secret on the management cluster holding the
                  ed25519 keypair. Keys: ssh-privatekey, ssh-publickey.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
