apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: openstack-sample
  labels:
    app.kubernetes.io/name: simple-cluster-operator
spec:
  target:
    namespace: default

  inputs:
    - { name: network,        type: string, default: cloud_080745_1,     description: "Neutron network" }
    - { name: floatingIPPool, type: string, default: external,           description: "External network providing FIPs for control-plane VMs" }
    - { name: image,          type: string, default: "Ubuntu 24.04 LTS", description: "Glance image" }
    - { name: flavorPattern,  type: string, default: '^eo[12]a\.',       description: "Regex narrowing Nova flavor candidates" }

  resources:
    - name: sshkey
      apiVersion: sshkeys.apeirora.eu/v1alpha1
      kind: SSHKey
      readiness:
        phasePath: status.ready
        phaseReadyValue: "true"
      template: |
        apiVersion: sshkeys.apeirora.eu/v1alpha1
        kind: SSHKey
        spec:
          keyType: ed25519
          exportToSecret:
            name: openstack-sample-ssh

    - name: vmcp
      apiVersion: cloudferro.eu/v1alpha1
      kind: OpenStackVM
      repeat: "{{ .SC.controlPlane.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: cloudferro.eu/v1alpha1
        kind: OpenStackVM
        spec:
          credentialsRef:
            name: openstack-creds
          network: {{ .Inputs.network }}
          floatingIPPool: {{ .Inputs.floatingIPPool }}
          floatingIP: true
          securityGroups:
            - default
          resources:
            cpu: "{{ .SC.controlPlane.requested.cpu }}"
            memory: "{{ .SC.controlPlane.requested.memory }}"
            flavorPattern: '{{ .Inputs.flavorPattern }}'
          image: "{{ .Inputs.image }}"
          userData: |
            #cloud-config
            ssh_authorized_keys:
              - "{{ .Resources.sshkey.publicKey | trim }}"

    - name: vmworker
      apiVersion: cloudferro.eu/v1alpha1
      kind: OpenStackVM
      repeat: "{{ .SC.workers.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: cloudferro.eu/v1alpha1
        kind: OpenStackVM
        spec:
          credentialsRef:
            name: openstack-creds
          network: {{ .Inputs.network }}
          floatingIP: false
          securityGroups:
            - default
          resources:
            cpu: "{{ .SC.workers.requested.cpu }}"
            memory: "{{ .SC.workers.requested.memory }}"
            flavorPattern: '{{ .Inputs.flavorPattern }}'
          image: "{{ .Inputs.image }}"
          userData: |
            #cloud-config
            ssh_authorized_keys:
              - "{{ .Resources.sshkey.publicKey | trim }}"

    - name: cluster
      apiVersion: ubuntu.apeirora.eu/v1alpha1
      kind: UbuntuCluster
      dependsOn:
        - sshkey
        - vmcp
        - vmworker
      # k3s lives only on the VMs below. When the SC is deleted those VMs
      # are torn down in the same cascade, so UbuntuCluster's SSH-based
      # uninstall has nothing to talk to. Skip its graceful cleanup.
      forceCleanupOnCascade: true
      template: |
        apiVersion: ubuntu.apeirora.eu/v1alpha1
        kind: UbuntuCluster
        spec:
          ssh:
            user: eouser
            privateKeySecretRef:
              name: openstack-sample-ssh
          controlPlane:
            hosts:
              {{- range $i, $vm := .Resources.vmcp }}
              - name: cp-{{ $i }}
                address: {{ $vm.status.internalAddress }}
                externalAddress: {{ $vm.status.externalAddress }}
              {{- end }}
          workers:
            hosts:
              {{- range $i, $vm := .Resources.vmworker }}
              - name: worker-{{ $i }}
                address: {{ $vm.status.internalAddress }}
              {{- end }}

  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
