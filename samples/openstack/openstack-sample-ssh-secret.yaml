# SSH keypair injected into the sample OpenStack VMs.
#
# No key material is shipped in this repository. Generate a throwaway keypair and
# create the Secret from it before applying the rest of this sample:
#
#   ssh-keygen -t ed25519 -N '' -C openstack-sample-ssh -f /tmp/openstack-sample-ssh
#   kubectl create secret generic openstack-sample-ssh \
#     --type=kubernetes.io/ssh-auth \
#     --from-file=ssh-privatekey=/tmp/openstack-sample-ssh \
#     --from-file=ssh-publickey=/tmp/openstack-sample-ssh.pub
#
# Alternatively fill in the placeholders below. Never commit real key material.
apiVersion: v1
kind: Secret
metadata:
  name: openstack-sample-ssh
type: kubernetes.io/ssh-auth
stringData:
  ssh-privatekey: |
    <PASTE YOUR OPENSSH PRIVATE KEY HERE>
  ssh-publickey: "<PASTE YOUR OPENSSH PUBLIC KEY HERE>"
