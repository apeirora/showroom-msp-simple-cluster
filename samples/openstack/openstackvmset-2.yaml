# Standalone smoke test for simple-cluster-operator-openstack against
# CloudFerro (region WAW4-1). Spins up one Ubuntu 24.04 VM with a
# floating IP attached. The full SC → SCPC → OpenStackVMSet + UbuntuCluster
# chain is gated on simple-cluster-operator-ubuntu landing.
apiVersion: openstack.apeirora.eu/v1alpha1
kind: OpenStackVMSet
metadata:
  name: vm2
spec:
  credentialsRef:
    name: cloudferro-creds
  network: cloud_080745_1
  floatingIPPool: external
  securityGroups:
    - default
  groups:
    - name: test
      count: 1
      # resources is the per-VM CPU/memory FLOOR; the operator picks
      # the smallest Nova flavor that satisfies both. Status reports
      # which flavor was chosen.
      resources:
        cpu: 16
        memory: 60Gi
      # CloudFerro Glance images (exact name required; `openstack image list`):
      #   Ubuntu 22.04 LTS, Ubuntu 24.04 LTS, Rocky Linux 9, AlmaLinux 9, CentOS 9 Stream,
      #   Fedora CoreOS 39 K8s-Magnum, Windows 2019/2022,
      #   ubuntu-2404-kube-v1.31.x / v1.32.x (pre-baked k8s)
      image: "Ubuntu 24.04 LTS"
      floatingIP: true
