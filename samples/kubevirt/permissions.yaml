# The simple-cluster-operator's built-in ClusterRole only covers its own
# CRDs + Secrets. When an SCPC targets the local management cluster (as
# the k3s-kubevirt sample does) the operator's ServiceAccount needs RBAC
# for every kind the SCPC renders. This bundle adds the missing rules
# for Service + the three KubeVirt resources used here.
#
# Remote-target SCPCs (e.g. the Gardener samples) do NOT need this — the
# operator authenticates against the remote API via the kubeconfig Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simple-cluster-operator-k3s-kubevirt
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
      - virtualmachineinstancereplicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simple-cluster-operator-k3s-kubevirt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: simple-cluster-operator-k3s-kubevirt
subjects:
  - kind: ServiceAccount
    name: simple-cluster-operator-controller-manager
    namespace: simple-cluster-operator-system
