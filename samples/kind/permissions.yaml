# Lets simple-cluster-operator (which renders the SCPC) create
# KindCluster CRs that kind-cluster-operator then materialises.
# Same shape as samples/kubevirt/permissions.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simple-cluster-operator-kind-on-host
rules:
  - apiGroups: ["kind.apeirora.eu"]
    resources: ["kindclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simple-cluster-operator-kind-on-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: simple-cluster-operator-kind-on-host
subjects:
  - kind: ServiceAccount
    name: simple-cluster-operator-controller-manager
    namespace: simple-cluster-operator-system
