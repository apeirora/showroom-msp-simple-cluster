# SCPC that delegates "make me a cluster" to kind-cluster-operator.
# simple-cluster-operator renders a KindCluster CR (kind.apeirora.eu/v1alpha1);
# kind-cluster-operator picks it up and runs `kind create cluster` on the
# host's docker (DooD via the operator's mounted /var/run/docker.sock).
#
# Prerequisites on the management cluster:
#   - kind-cluster-operator installed (kubectl apply -k kind-cluster-operator/config/default)
#   - The host's /var/run/docker.sock must be mounted into the kind node
#     (quick-start-kind.sh now does this).
apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: kind-on-host
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: default

  inputs:
    - { name: nodeImage, type: string, default: "", allowEmpty: true, description: "Optional kindest/node tag to pin Kubernetes version. Empty = kind compiled-in default." }

  resources:
    - name: cluster
      apiVersion: kind.apeirora.eu/v1alpha1
      kind: KindCluster
      template: |
        apiVersion: kind.apeirora.eu/v1alpha1
        kind: KindCluster
        spec:
          clusterName: {{ .Target.name }}
          workers: {{ .SC.workers.nodes }}
          {{- if .Inputs.nodeImage }}
          nodeImage: {{ .Inputs.nodeImage }}
          {{- end }}

  # kind-cluster-operator publishes the new cluster's kubeconfig into a
  # Secret named `<KindCluster.name>-kubeconfig` in the same namespace.
  # simple-cluster-operator then mirrors that Secret into SC.Namespace.
  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
