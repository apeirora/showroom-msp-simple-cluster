# This will install k3s cluster on ubuntu machines.
# Bastion topology:
# - bootstrap CP needs `externalAddress` — operator SSHes there directly.
apiVersion: ubuntu.apeirora.eu/v1alpha1
kind: UbuntuCluster
metadata:
  name: ubuntu-cluster-sample
spec:
  version: "v1.31.4+k3s1" # Optional. Empty = operator's default.
  ssh:
    user: ubuntu-cluster
    # Exactly one of privateKeySecretRef / passwordSecretRef; the chosen
    # method applies to every host. Secret is in this CR's namespace.
    privateKeySecretRef:
      name: ubuntu-cluster-sample-ssh
    # Password alternative (kubernetes.io/basic-auth Secret, `password` key):
    # passwordSecretRef:
    #   name: ubuntu-cluster-sample-pw
  controlPlane:
    hosts:
      - name: cp-0
        address: 10.128.0.10            # internal IP — for k3s peer/agent
        externalAddress: 203.0.113.10   # public IP — replace with your host
  workers:
    hosts:
      - name: worker-0
        address: 10.128.0.9       # internal address
      - name: worker-1
        address: 10.128.0.11      # internal address
