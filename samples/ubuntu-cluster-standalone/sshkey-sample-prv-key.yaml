# SSH key the operator uses to reach the Ubuntu hosts in this sample.
#
# No key material is shipped in this repository. Use the key that already grants
# you access to the hosts, or generate a throwaway keypair and install its public
# half on them:
#
#   ssh-keygen -t ed25519 -N '' -C ubuntu-cluster-sample -f /tmp/ubuntu-cluster-sample
#   kubectl create secret generic ubuntu-cluster-sample-ssh \
#     --type=kubernetes.io/ssh-auth \
#     --from-file=ssh-privatekey=/tmp/ubuntu-cluster-sample
#
# Alternatively fill in the placeholder below. Never commit real key material.
apiVersion: v1
kind: Secret
metadata:
  name: ubuntu-cluster-sample-ssh
type: kubernetes.io/ssh-auth
stringData:
  ssh-privatekey: |
    <PASTE YOUR OPENSSH PRIVATE KEY HERE>
