apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleCluster
metadata:
  # Keep the SC name short: Gardener enforces a 21-char cap on
  # <project>-<shoot> across project+namePrefix+SC.name.
  name: t1
spec:
  controlPlane:
    nodes: 1
    requested:
      cpu: 2
      memory: 16Gi
  workers:
    nodes: 1
    maxNodes: 4
    requested:
      cpu: 16
      memory: 32Gi
  providerConfigRefs:
    - dati-openstack
    - sap-ironcore
