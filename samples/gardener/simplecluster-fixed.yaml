apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleCluster
metadata:
  # Keep the SC name short: Gardener enforces a 21-char cap on
  # <project>-<shoot> across project+namePrefix+SC.name.
  name: sample-fixed
spec:
  controlPlane:
    nodes: 1
    requested:
      cpu: 2
      memory: 16Gi
  workers:
    nodes: 1
    requested:
      cpu: 4
      memory: 8Gi
  providerConfigRefs:
    - sap-gardener-openstack

