# Secret carrying the kubeconfig for the IronCore API server.
# Replace the value of `kubeconfig` with the base64-encoded kubeconfig
# of your IronCore cluster before applying.
apiVersion: v1
kind: Secret
metadata:
  name: ironcore-creds
type: Opaque
data:
  # base64 of: # Replace with your IronCore cluster kubeconfig
  kubeconfig: IyBSZXBsYWNlIHdpdGggeW91ciBJcm9uQ29yZSBjbHVzdGVyIGt1YmVjb25maWc=
