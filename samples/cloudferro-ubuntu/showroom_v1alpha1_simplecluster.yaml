# End-to-end smoke: 1 CP + 1 worker on CloudFerro.
#
# k3s server needs ~1.5 GiB just for etcd + apiserver + controller-manager
# + scheduler; eo1a.xsmall (1 GiB) thrashes itself to death. Bumping CP
# to cpu=2/memory=2Gi picks eo1a.small (2 vCPU / 2 GiB / 16 GiB disk).
# Workers stay on the cheapest eo1a.xsmall.
#
# Target footprint: 2 VMs (1x small + 1x xsmall) / 3 vCPU / 3 GiB / 2 FIPs.
apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleCluster
metadata:
  name: cloudferro-demo
spec:
  controlPlane:
    nodes: 1
    requested:
      cpu: 2
      memory: 2Gi
  workers:
    nodes: 1
    requested:
      cpu: 1
      memory: 1Gi
  providerConfigRefs:
    - cloudferro-ubuntu
