## End-to-end: SimpleCluster -> OpenStackVMSet -> UbuntuCluster.
##
## Before `kubectl apply -k samples/cloudferro-ubuntu/`:
##   1. Create the cloudferro-creds Secret in `default` namespace:
##      cd ../openstack && ./create-secret.sh
##   2. Make sure all three operators are deployed (simple-cluster-operator,
##      -openstack, -ubuntu).
resources:
  - permissions.yaml
  - showroom_v1alpha1_simpleclusterproviderconfig_cloudferro-ubuntu.yaml
  - showroom_v1alpha1_simplecluster.yaml
