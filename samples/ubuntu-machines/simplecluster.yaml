apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleCluster
metadata:
  name: um-sample
spec:
  # Pool composition (samples/ubuntu-machines/ubuntu-machines.yaml):
  #   um-0  4 CPU / 8 GiB  external IP   ← matches cp claim
  #   um-1  2 CPU / 2 GiB  external IP
  #   um-2  2 CPU / 2 GiB  -             ← matches worker claim
  #   um-3  4 CPU / 8 GiB  -             ← matches worker claim
  controlPlane:
    nodes: 1
    requested:
      cpu: 4
      memory: 8Gi
  workers:
    nodes: 2
    requested:
      cpu: 2
      memory: 2Gi
  providerConfigRefs:
    - ubuntu-machines-sample
  # Manifests applied to the provisioned cluster once it is Ready (over the
  # synced kubeconfig). Best-effort: each one's outcome shows up as a
  # status condition "Resource-<name>"; a failure never blocks Phase=Ready.
  resources:
    - name: demo-namespace
      content: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: demo
    - name: demo-configmap
      content: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: demo
          namespace: demo
        data:
          hello: world
