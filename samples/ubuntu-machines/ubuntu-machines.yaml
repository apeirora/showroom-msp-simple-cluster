# Pool of four UbuntuMachines backed by the OpenStackVMs declared in
# samples/openstack/vm-instances.yaml. All four share the
# `openstack-vm-instances-ssh` Secret that the openstack operator
# generated on first reconcile, so every UbuntuMachine references the
# same `privateKeySecretRef` (name + namespace).
#
# UbuntuMachine is cluster-scoped (the pool is global; UbuntuMachineClaims
# are namespaced — PV/PVC pattern), so credential Secret refs MUST carry an
# explicit namespace.
#
# Two large (4 vCPU / 8 GiB) and two small (2 vCPU / 2 GiB); only um-0
# and um-1 carry a floating IP so claims with externalAddressRequired=true
# can only bind to those.
#
# Labels let an UbuntuMachineClaim pin to a subset of the pool via
# spec.selector (equality matchLabels). Here all four are `pool: showroom`.
---
apiVersion: ubuntumachines.apeirora.eu/v1alpha1
kind: UbuntuMachine
metadata:
  name: um-0
  labels:
    pool: showroom
spec:
  address: 192.168.168.150
  externalAddress: 203.0.113.20
  ssh:
    user: eouser
    privateKeySecretRef:
      name: openstack-vm-instances-ssh
      namespace: default
  capacity:
    cpu: "4"
    memory: 8Gi
---
apiVersion: ubuntumachines.apeirora.eu/v1alpha1
kind: UbuntuMachine
metadata:
  name: um-1
  labels:
    pool: showroom
spec:
  address: 192.168.168.225
  externalAddress: 203.0.113.21
  ssh:
    user: eouser
    privateKeySecretRef:
      name: openstack-vm-instances-ssh
      namespace: default
  capacity:
    cpu: "2"
    memory: 2Gi
---
apiVersion: ubuntumachines.apeirora.eu/v1alpha1
kind: UbuntuMachine
metadata:
  name: um-2
  labels:
    pool: showroom
spec:
  address: 192.168.168.58
  ssh:
    user: eouser
    privateKeySecretRef:
      name: openstack-vm-instances-ssh
      namespace: default
  capacity:
    cpu: "2"
    memory: 2Gi
---
apiVersion: ubuntumachines.apeirora.eu/v1alpha1
kind: UbuntuMachine
metadata:
  name: um-3
  labels:
    pool: showroom
spec:
  address: 192.168.168.253
  ssh:
    user: eouser
    privateKeySecretRef:
      name: openstack-vm-instances-ssh
      namespace: default
  capacity:
    cpu: "4"
    memory: 8Gi
