# Four predefined Ubuntu machines with SSH access and sudo without password.
---
apiVersion: ubuntumachines.apeirora.eu/v1alpha1
kind: UbuntuMachine
metadata:
  name: um-0
spec:
  address: 192.168.168.229
  externalAddress: 45.130.30.74
  ssh:
    user: eouser
    privateKeySecretRef:
      name: single-vm-sample-1-ssh
  capacity:
    cpu: "4"
    memory: 8Gi
