{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: ubuntumachines.ubuntumachines.apeirora.eu
spec:
  group: ubuntumachines.apeirora.eu
  names:
    kind: UbuntuMachine
    listKind: UbuntuMachineList
    plural: ubuntumachines
    singular: ubuntumachine
    shortNames:
      - um
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.address
          name: Address
          type: string
        - jsonPath: .spec.externalAddress
          name: External
          type: string
        - jsonPath: .spec.capacity.cpu
          name: CPU
          type: string
        - jsonPath: .spec.capacity.memory
          name: Memory
          type: string
        - jsonPath: .status.boundClaimRef.name
          name: Claim
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          description: |-
            UbuntuMachine is one pre-existing host an administrator registers
            into the pool. Consumers ask for machines via UbuntuMachineClaim —
            the operator never touches the host itself.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - address
                - ssh
              properties:
                address:
                  description: Internal IP/DNS name. Required.
                  type: string
                  minLength: 1
                externalAddress:
                  description: |-
                    Public IP/DNS name when one exists. Required to bind
                    against claims with `externalAddressRequired: true`.
                  type: string
                ssh:
                  description: |-
                    Credential a consumer should use to log in. Exactly one of
                    privateKeySecretRef or passwordSecretRef must be set.
                  type: object
                  required:
                    - user
                  x-kubernetes-validations:
                    - rule: has(self.privateKeySecretRef) != has(self.passwordSecretRef)
                      message: exactly one of privateKeySecretRef or passwordSecretRef must be set
                  properties:
                    user:
                      type: string
                      minLength: 1
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    privateKeySecretRef:
                      description: |-
                        Secret with the SSH private key under `ssh-privatekey`.
                        Namespaced because UbuntuMachine is cluster-scoped.
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    passwordSecretRef:
                      description: Secret with the login password under `password`.
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                capacity:
                  description: |-
                    Advertised capacity. Claim binder requires
                    `capacity.cpu >= required.cpu && capacity.memory >= required.memory`.
                    Zero / omitted means "unconstrained" on that dimension.
                  type: object
                  properties:
                    cpu:
                      anyOf:
                        - type: integer
                        - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    memory:
                      anyOf:
                        - type: integer
                        - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Available
                    - Bound
                boundClaimRef:
                  type: object
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
{{- end -}}
