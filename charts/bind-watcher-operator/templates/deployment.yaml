apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind-watcher-operator
  labels:
    app: bind-watcher-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind-watcher-operator
  template:
    metadata:
      labels:
        app: bind-watcher-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: bind-watcher-operator
          image: {{ .Values.registry }}{{ .Values.image }}:{{ .Values.imageTag | default .Chart.AppVersion }}
          env:
            - name: KCP_KUBECONFIG
              value: /kcp.admin.config
            - name: KCP_DISCOVERY_INTERVAL
              value: {{ .Values.KCP.discoveryInterval | quote }}
            - name: CLUSTER_LABEL_KEY
              value: {{ .Values.mapping.clusterLabelKey | quote }}
            - name: EXPORTS_ANNOTATION_KEY
              value: {{ .Values.mapping.exportsAnnotationKey | quote }}
            - name: EXPORTS_SEPARATOR
              value: {{ .Values.mapping.separator | quote }}
            - name: CREATE_NAMESPACES
              value: {{ .Values.mapping.createNamespaces | quote }}
            - name: MANAGED_LABEL_KEY
              value: {{ .Values.mapping.managedLabelKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /kcp.admin.config
              subPath: kubeconfig
              name: kcp-config
      volumes:
        - name: kcp-config
          secret:
            secretName: {{ .Values.KCP.kubeconfig.secretName }}
