registry: ghcr.io/apeirora
image: /bind-watcher-operator

serviceAccount: bind-watcher-operator

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"

# How KCP bindings are projected onto MSP namespaces.
mapping:
  # Namespace selector label whose value equals the KCP logical cluster name.
  # The MSP namespace is named after the logical cluster, so the well-known
  # name label selects it directly.
  clusterLabelKey: kubernetes.io/metadata.name
  # Annotation written with the list of bound exports.
  exportsAnnotationKey: bind.simple-cluster.apeirora.eu/exports
  # Separator joining export names in the annotation value.
  separator: ","

KCP:
  kubeconfig:
    # Kubeconfig targeting the workspace that holds the APIExportEndpointSlices.
    secretName: kcp-kubeconfig
  # How often to re-discover APIExportEndpointSlices in that workspace.
  discoveryInterval: 1m
