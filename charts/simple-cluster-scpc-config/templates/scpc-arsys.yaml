{{- if or .Values.enable.arsys.dedicated .Values.enable.arsys.virtual }}
apiVersion: v1
kind: Namespace
metadata:
  name: simple-cluster-arsys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arsys-token
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-msp
  target:
    name: arsys-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: simple-cluster-arsys-token
        property: token
{{- end}}
{{ if .Values.enable.arsys.dedicated }}
---
# Dedicated
{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: arsys-dedicated
  labels:
    app.kubernetes.io/name: simple-cluster-operator
spec:
  target:
    namespace: "{{ .SC.namespace }}"

  inputs:
    - { name: applianceID,  type: string, default: '5D3BBD43E3AB7E8884753025F70DF294',            description: "arsys applianceID" }
    - { name: datacenterID,  type: string, default: '9B94281B5B67A755F2B76165E25F6A65',           description: "arsys datacenterID" }

  resources:
    - name: sshkey
      apiVersion: sshkeys.apeirora.eu/v1alpha1
      kind: SSHKey
      readiness:
        phasePath: status.ready
        phaseReadyValue: "true"
      template: |
        apiVersion: sshkeys.apeirora.eu/v1alpha1
        kind: SSHKey
        spec:
          keyType: ed25519

    - name: vmcp
      apiVersion: arsys.apeirora.eu/v1alpha1
      kind: ArsysUbuntuMachine
      repeat: "{{ .SC.controlPlane.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: arsys.apeirora.eu/v1alpha1
        kind: ArsysUbuntuMachine
        spec:
          tokenSecretRef:
            name: arsys-token
            namespace: simple-cluster-system-scpc-configs
          passwordSecretRef:
            name: "{{ printf "%s-%s-cp-%d" .SC.namespace .SC.name .Index }}"
            namespace: simple-cluster-arsys
          server:
            type: dedicated
            applianceID: "{{ .Inputs.applianceID }}"
            datacenterID: "{{ .Inputs.datacenterID }}"
            vcore: {{ .SC.controlPlane.requested.cpu }}
            ram: {{ .SC.controlPlane.requested.memory | trimSuffix "Gi" }}
            sshKeyRef:
              apiGroup: sshkeys.apeirora.eu
              kind: SSHKey
              name: {{ .Resources.sshkey.metadata.name }}
          ssh:
            user: root

    - name: vmworker
      apiVersion: arsys.apeirora.eu/v1alpha1
      kind: ArsysUbuntuMachine
      repeat: "{{ .SC.workers.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: arsys.apeirora.eu/v1alpha1
        kind: ArsysUbuntuMachine
        spec:
          tokenSecretRef:
            name: arsys-token
            namespace: simple-cluster-system-scpc-configs
          passwordSecretRef:
            name: "{{ printf "%s-%s-worker-%d" .SC.namespace .SC.name .Index }}"
            namespace: simple-cluster-arsys
          server:
            type: dedicated
            applianceID: "{{ .Inputs.applianceID }}"
            datacenterID: "{{ .Inputs.datacenterID }}"
            vcore: {{ .SC.workers.requested.cpu }}
            ram: {{ .SC.workers.requested.memory | trimSuffix "Gi" }}
            sshKeyRef:
              apiGroup: sshkeys.apeirora.eu
              kind: SSHKey
              name: {{ .Resources.sshkey.metadata.name }}
          ssh:
            user: root

    - name: cluster
      apiVersion: ubuntu.apeirora.eu/v1alpha1
      kind: UbuntuCluster
      dependsOn:
        - vmcp
        - vmworker
      forceCleanupOnCascade: true
      template: |
        apiVersion: ubuntu.apeirora.eu/v1alpha1
        kind: UbuntuCluster
        spec:
          ssh:
            user: root
            passwordSecretRef:
              name: "{{ printf "%s-%s-cp-0" .SC.namespace .SC.name }}"
              namespace: simple-cluster-arsys
          controlPlane:
            hosts:
              {{- range $i, $vm := .Resources.vmcp }}
              - name: cp-{{ $i }}
                address: {{ $vm.status.address }}
                externalAddress: {{ $vm.status.address }}
                passwordSecretRef:
                  name: "{{ printf "%s-%s-cp-%d" $.SC.namespace $.SC.name $i }}"
                  namespace: simple-cluster-arsys
              {{- end }}
          workers:
            hosts:
              {{- range $i, $vm := .Resources.vmworker }}
              - name: worker-{{ $i }}
                address: {{ $vm.status.address }}
                externalAddress: {{ $vm.status.address }}
                passwordSecretRef:
                  name: "{{ printf "%s-%s-worker-%d" $.SC.namespace $.SC.name $i }}"
                  namespace: simple-cluster-arsys
              {{- end }}

  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
` }}
{{- end}}

