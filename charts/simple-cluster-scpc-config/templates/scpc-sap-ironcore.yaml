{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-ironcore
  labels:
    app.kubernetes.io/name: simple-cluster-operator
spec:
  target:
    namespace: "{{ .SC.namespace }}"

  inputs:
    - { name: network,             type: string, default: sample-net,                              description: "IronCore Network name; operator ensures it exists" }
    - { name: ipPool,              type: string, default: "",                                      description: "ipam Prefix pool name to allocate NIC IPs from (/32 ephemeral). Leave empty to use environment default." }
    - { name: image,               type: string, default: "ghcr.io/ironcore-dev/gardenlinux:latest", description: "OCI image reference for the boot volume" }
    - { name: machineClassPattern, type: string, default: "",                                      description: "Optional Go regex narrowing MachineClass candidates" }
    - { name: sshUser,             type: string, default: root,                                    description: "OS user the SSH key is injected for via ignition" }

  resources:
    - name: sshkey
      apiVersion: sshkeys.apeirora.eu/v1alpha1
      kind: SSHKey
      readiness:
        phasePath: status.ready
        phaseReadyValue: "true"
      template: |
        apiVersion: sshkeys.apeirora.eu/v1alpha1
        kind: SSHKey
        spec:
          keyType: ed25519
          exportToSecret:
            name: ironcore-sample-ssh

    - name: vmcp
      apiVersion: ironcore.apeirora.eu/v1alpha1
      kind: IronCoreVM
      repeat: "{{ .SC.controlPlane.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: ironcore.apeirora.eu/v1alpha1
        kind: IronCoreVM
        spec:
          ironcoreKubeconfig:
            name: ironcore-kubeconfig
          network: {{ .Inputs.network }}
          ipPool: {{ .Inputs.ipPool }}
          image: "{{ .Inputs.image }}"
          publicIP: true
          sshKeyRef:
            apiGroup: sshkeys.apeirora.eu
            kind: SSHKey
            name: {{ .Resources.sshkey.metadata.name }}
          sshUser: {{ .Inputs.sshUser }}
          resources:
            cpu: "{{ .SC.controlPlane.requested.cpu }}"
            memory: "{{ .SC.controlPlane.requested.memory }}"
            machineClassPattern: '{{ .Inputs.machineClassPattern }}'

    - name: vmworker
      apiVersion: ironcore.apeirora.eu/v1alpha1
      kind: IronCoreVM
      repeat: "{{ .SC.workers.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: ironcore.apeirora.eu/v1alpha1
        kind: IronCoreVM
        spec:
          ironcoreKubeconfig:
            name: ironcore-kubeconfig
          network: {{ .Inputs.network }}
          ipPool: {{ .Inputs.ipPool }}
          image: "{{ .Inputs.image }}"
          publicIP: false
          sshKeyRef:
            apiGroup: sshkeys.apeirora.eu
            kind: SSHKey
            name: {{ .Resources.sshkey.metadata.name }}
          sshUser: {{ .Inputs.sshUser }}
          resources:
            cpu: "{{ .SC.workers.requested.cpu }}"
            memory: "{{ .SC.workers.requested.memory }}"
            machineClassPattern: '{{ .Inputs.machineClassPattern }}'

    - name: cluster
      apiVersion: ubuntu.apeirora.eu/v1alpha1
      kind: UbuntuCluster
      dependsOn:
        - sshkey
        - vmcp
        - vmworker
      forceCleanupOnCascade: true
      template: |
        apiVersion: ubuntu.apeirora.eu/v1alpha1
        kind: UbuntuCluster
        spec:
          ssh:
            user: root
            privateKeySecretRef:
              name: ironcore-sample-ssh
          controlPlane:
            hosts:
              {{- range $i, $vm := .Resources.vmcp }}
              - name: cp-{{ $i }}
                address: {{ $vm.status.internalAddress }}
                externalAddress: {{ $vm.status.externalAddress }}
              {{- end }}
          workers:
            hosts:
              {{- range $i, $vm := .Resources.vmworker }}
              - name: worker-{{ $i }}
                address: {{ $vm.status.internalAddress }}
              {{- end }}

  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
`}}