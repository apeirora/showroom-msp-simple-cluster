{{- if or .Values.enable.sap.openstack .Values.enable.sap.ironcore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sap-gardener-kubeconfig
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-msp
  target:
    name: sap-gardener-kubeconfig
    creationPolicy: Owner
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: simple-cluster-gardener-sap-kubeconfig
        property: kubeconfig
{{- end }}

{{- if .Values.enable.sap.ironcore }}
---
{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-gardener-ironcore
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: garden-pm-cc-d2
    kubeconfigSecretRef:
      name: sap-gardener-kubeconfig
      namespace: simple-cluster-system-scpc-configs
  inputs:
    - { name: cloudProfile, type: string,   default: ironcore,                    description: "Gardener CloudProfile name" }
    - { name: region,       type: string,   default: wdf4,                        description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.34.5",                    description: "Kubernetes version" }
    - { name: machineType,  from: profile,                                        description: "Worker machine type; auto-picked as the smallest profile fitting the SC's requested cpu/memory" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: wdf4a,                       description: "Availability zone for the worker pool" }
  profiles:
    - { name: memory-intel1-1cpu, cpu: "1", memory: 8Gi }
    - { name: memory-intel1-2cpu, cpu: "2", memory: 16Gi }
  resources:
    - name: shoot
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 9 | printf "sc-%s" }}'
      deletionAnnotations:
        confirmation.gardener.cloud/deletion: "true"
      readiness:
        phasePath: status.lastOperation.state
        phaseReadyValue: Succeeded
        phaseFailedValues:
          - Failed
          - Error
        lastOperationPath: status.lastOperation.description
        lastErrorPath: status.lastErrors[0].description
      template: |
        apiVersion: core.gardener.cloud/v1beta1
        kind: Shoot
        spec:
          cloudProfile:
            name: {{ .Inputs.cloudProfile }}
            kind: CloudProfile
          credentialsBindingName: my-ironcore-secret
          region: {{ .Inputs.region }}
          kubernetes:
            version: "{{ .Inputs.k8sVersion }}"
          provider:
            type: ironcore
            workers:
              - name: worker-main
                minimum: {{ .SC.workers.nodes }}
                maximum: {{ .SC.workers.nodes }}
                machine:
                  type: {{ .Inputs.machineType }}
                  image:
                    name: {{ .Inputs.machineImage }}
                zones:
                  - {{ .Inputs.zone }}
          networking:
            type: calico
            nodes: 10.250.0.0/16
            pods: 100.64.0.0/12
            services: 100.104.0.0/13
  kubeconfigSource:
    resourceName: shoot
    subResource:
      apiVersion: authentication.gardener.cloud/v1alpha1
      kind: AdminKubeconfigRequest
      subResource: adminkubeconfig
      kubeconfigPath: status.kubeconfig
      expirationPath: status.expirationTimestamp
    validity: 720h
    renewalBefore: 72h
` }}
{{- end }}

{{- if .Values.enable.sap.openstack }}
---
{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-gardener-openstack
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: garden-pm-cc-d2
    kubeconfigSecretRef:
      name: sap-gardener-kubeconfig
      namespace: simple-cluster-system-scpc-configs
  inputs:
    - { name: cloudProfile, type: string,   default: converged-cloud-ora-fp,      description: "Gardener CloudProfile name" }
    - { name: region,       type: string,   default: eu-de-1,                     description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.33.9",                    description: "Kubernetes version" }
    - { name: machineType,  from: profile,                                        description: "Worker machine type; auto-picked as the smallest profile fitting the SC's requested cpu/memory" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: eu-de-1a,                    description: "Availability zone for the worker pool" }
  profiles:
    - { name: g_c2_m4,    cpu: "2",   memory: 4Gi }
    - { name: g_c2_m8,    cpu: "2",   memory: 8Gi }
    - { name: g_c4_m8,    cpu: "4",   memory: 8Gi }
    - { name: g_c4_m16,   cpu: "4",   memory: 16Gi }
    - { name: g_c6_m24,   cpu: "6",   memory: 24Gi }
    - { name: g_c8_m16,   cpu: "8",   memory: 16Gi }
    - { name: g_c8_m32,   cpu: "8",   memory: 32Gi }
    - { name: g_c12_m24,  cpu: "12",  memory: 24Gi }
    - { name: g_c12_m48,  cpu: "12",  memory: 48Gi }
    - { name: g_c16_m32,  cpu: "16",  memory: 32Gi }
    - { name: g_c16_m64,  cpu: "16",  memory: 64Gi }
    - { name: g_c24_m96,  cpu: "24",  memory: 96Gi }
  resources:
    - name: shoot
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 9 | printf "sc-%s" }}'
      deletionAnnotations:
        confirmation.gardener.cloud/deletion: "true"
      readiness:
        phasePath: status.lastOperation.state
        phaseReadyValue: Succeeded
        phaseFailedValues:
          - Failed
          - Error
        lastOperationPath: status.lastOperation.description
        lastErrorPath: status.lastErrors[0].description
      template: |
        apiVersion: core.gardener.cloud/v1beta1
        kind: Shoot
        spec:
          cloudProfile:
            name: {{ .Inputs.cloudProfile }}
            kind: CloudProfile
          secretBindingName: cc-eu-de-1
          region: {{ .Inputs.region }}
          kubernetes:
            version: "{{ .Inputs.k8sVersion }}"
          addons:
            nginxIngress:
              enabled: true
              loadBalancerSourceRanges:
                - 0.0.0.0/0
          provider:
            type: openstack
            infrastructureConfig:
              apiVersion: openstack.provider.extensions.gardener.cloud/v1alpha1
              kind: InfrastructureConfig
              floatingPoolName: FloatingIP-external-ora-01
              networks:
                workers: 10.250.0.0/16
            controlPlaneConfig:
              apiVersion: openstack.provider.extensions.gardener.cloud/v1alpha1
              kind: ControlPlaneConfig
              loadBalancerProvider: f5
            workers:
              - name: worker-main
                minimum: {{ .SC.workers.nodes }}
                maximum: {{ .SC.workers.nodes }}
                machine:
                  type: {{ .Inputs.machineType }}
                  image:
                    name: {{ .Inputs.machineImage }}
                zones:
                  - {{ .Inputs.zone }}
          networking:
            type: calico
            nodes: 10.250.0.0/16
            pods: 100.64.0.0/12
            services: 100.104.0.0/13
  kubeconfigSource:
    resourceName: shoot
    subResource:
      apiVersion: authentication.gardener.cloud/v1alpha1
      kind: AdminKubeconfigRequest
      subResource: adminkubeconfig
      kubeconfigPath: status.kubeconfig
      expirationPath: status.expirationTimestamp
    validity: 720h
    renewalBefore: 72h
` }}
{{- end }}
