{{- if .Values.enable.cloudferro }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudferro-openstack-creds
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-msp
  target:
    name: cloudferro-openstack-creds
    creationPolicy: Owner
  data:
    - secretKey: OS_APPLICATION_CREDENTIAL_ID
      remoteRef:
        key: simple-cluster-cloudferro-openstack-creds
        property: OS_APPLICATION_CREDENTIAL_ID
    - secretKey: OS_APPLICATION_CREDENTIAL_SECRET
      remoteRef:
        key: simple-cluster-cloudferro-openstack-creds
        property: OS_APPLICATION_CREDENTIAL_SECRET
    - secretKey: OS_AUTH_URL
      remoteRef:
        key: simple-cluster-cloudferro-openstack-creds
        property: OS_AUTH_URL
    - secretKey: OS_REGION_NAME
      remoteRef:
        key: simple-cluster-cloudferro-openstack-creds
        property: OS_REGION_NAME

---
{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: cloudferro
  labels:
    app.kubernetes.io/name: simple-cluster-operator
spec:
  target:
    namespace: "{{ .SC.namespace }}"

  inputs:
    - { name: network,        type: string, default: cloud_080745_1,     description: "Neutron network" }
    - { name: floatingIPPool, type: string, default: external,           description: "External network providing FIPs for control-plane VMs" }
    - { name: image,          type: string, default: "Ubuntu 24.04 LTS", description: "Glance image" }
    - { name: flavorPattern,  type: string, default: '^eo[12]a\.',       description: "Regex narrowing Nova flavor candidates" }

  resources:
    - name: sshkey
      apiVersion: sshkeys.apeirora.eu/v1alpha1
      kind: SSHKey
      readiness:
        phasePath: status.ready
        phaseReadyValue: "true"
      template: |
        apiVersion: sshkeys.apeirora.eu/v1alpha1
        kind: SSHKey
        spec:
          keyType: ed25519
          exportToSecret:
            name: cloudferro-ssh

    - name: vmcp
      apiVersion: openstack.apeirora.eu/v1alpha1
      kind: OpenStackVM
      repeat: "{{ .SC.controlPlane.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: openstack.apeirora.eu/v1alpha1
        kind: OpenStackVM
        spec:
          credentialsRef:
            name: cloudferro-openstack-creds
            namespace: simple-cluster-system-scpc-configs
          network: {{ .Inputs.network }}
          floatingIPPool: {{ .Inputs.floatingIPPool }}
          floatingIP: true
          securityGroups:
            - default
          resources:
            cpu: "{{ .SC.controlPlane.requested.cpu }}"
            memory: "{{ .SC.controlPlane.requested.memory }}"
            flavorPattern: '{{ .Inputs.flavorPattern }}'
          image: "{{ .Inputs.image }}"
          userData: |
            #cloud-config
            ssh_authorized_keys:
              - "{{ .Resources.sshkey.publicKey | trim }}"

    - name: vmworker
      apiVersion: openstack.apeirora.eu/v1alpha1
      kind: OpenStackVM
      repeat: "{{ .SC.workers.nodes }}"
      dependsOn:
        - sshkey
      template: |
        apiVersion: openstack.apeirora.eu/v1alpha1
        kind: OpenStackVM
        spec:
          credentialsRef:
            name: cloudferro-openstack-creds
            namespace: simple-cluster-system-scpc-configs
          network: {{ .Inputs.network }}
          floatingIPPool: {{ .Inputs.floatingIPPool }}
          floatingIP: true
          securityGroups:
            - default
          resources:
            cpu: "{{ .SC.workers.requested.cpu }}"
            memory: "{{ .SC.workers.requested.memory }}"
            flavorPattern: '{{ .Inputs.flavorPattern }}'
          image: "{{ .Inputs.image }}"
          userData: |
            #cloud-config
            ssh_authorized_keys:
              - "{{ .Resources.sshkey.publicKey | trim }}"

    - name: cluster
      apiVersion: ubuntu.apeirora.eu/v1alpha1
      kind: UbuntuCluster
      dependsOn:
        - sshkey
        - vmcp
        - vmworker
      forceCleanupOnCascade: true
      template: |
        apiVersion: ubuntu.apeirora.eu/v1alpha1
        kind: UbuntuCluster
        spec:
          ssh:
            user: eouser
            privateKeySecretRef:
              name: cloudferro-ssh
          controlPlane:
            hosts:
              {{- range $i, $vm := .Resources.vmcp }}
              - name: cp-{{ $i }}
                address: {{ $vm.status.internalAddress }}
                externalAddress: {{ $vm.status.externalAddress }}
              {{- end }}
          workers:
            hosts:
              {{- range $i, $vm := .Resources.vmworker }}
              - name: worker-{{ $i }}
                address: {{ $vm.status.internalAddress }}
                {{- if $vm.status.externalAddress }}
                externalAddress: {{ $vm.status.externalAddress }}
                {{- end }}
              {{- end }}

  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
` }}
{{- end }}