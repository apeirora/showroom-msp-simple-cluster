{{- if .Values.enable.singleSSH }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scpc-single-ssh
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-msp
  target:
    name: scpc-single-ssh
    creationPolicy: Owner
    template:
      type: kubernetes.io/ssh-auth
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: simple-cluster-spcp-single-ssh
        property: ssh-privatekey
    - secretKey: ssh-publickey
      remoteRef:
        key: simple-cluster-scpc-single-ssh
        property: ssh-publickey
  {{-end}}