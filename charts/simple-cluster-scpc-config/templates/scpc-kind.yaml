{{- if .Values.enable.kind }}
{{ `# SCPC that delegates "make me a cluster" to kind-cluster-operator.
apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: kind
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: "{{ .SC.namespace }}"

  inputs:
    - { name: nodeImage, type: string, default: "", allowEmpty: true, description: "Optional kindest/node tag to pin Kubernetes version. Empty = kind compiled-in default." }

  resources:
    - name: cluster
      apiVersion: kind.apeirora.eu/v1alpha1
      kind: KindCluster
      template: |
        apiVersion: kind.apeirora.eu/v1alpha1
        kind: KindCluster
        spec:
          clusterName: {{ .Target.name }}
          workers: {{ .SC.workers.nodes }}
          # Quote tenant-derived values: a type-string .Inputs value is free
          # text and enters this document as raw runes. Unquoted, a value
          # containing a newline can add keys or even dedent a duplicate
          # top-level "spec:", and the map decode keeps the LAST duplicate
          # key, silently replacing the whole rendered spec with the
          # tenant's. sprig's quote emits a JSON-escaped double-quoted
          # scalar, which YAML accepts verbatim.
          {{- if .Inputs.nodeImage }}
          nodeImage: {{ .Inputs.nodeImage | quote }}
          {{- end }}
  kubeconfigSource:
    resourceName: cluster
    secretRef:
      name: "{{ .Target.name }}-kubeconfig"
` }}
{{- end }}
