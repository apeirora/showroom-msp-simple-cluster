{{- if .Values.enable.dati }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dati-kubeconfig
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-msp
  target:
    name: dati-kubeconfig
    creationPolicy: Owner
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: simple-cluster-gardener-dati-kubeconfig
        property: kubeconfig
---
{{ `apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: dati
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: project_placeholder
    kubeconfigSecretRef:
      name: dati-kubeconfig
      namespace: simple-cluster-system-scpc-configs
  inputs:
    - { name: region,       type: string,   default: RegionOne,                   description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.33.9",                    description: "Kubernetes version" }
    - { name: machineType,  type: string,   default: 4vCPU-8192RAM-100STORAGE,    description: "Worker machine type from the CloudProfile" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: nova,                        description: "OpenStack availability zone for the worker pool" }
  resources:
    - name: shoot
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 18 | printf "sc-%s" }}'
      deletionAnnotations:
        confirmation.gardener.cloud/deletion: "true"
      readiness:
        phasePath: status.lastOperation.state
        phaseReadyValue: Succeeded
        phaseFailedValues:
          - Failed
          - Error
        lastOperationPath: status.lastOperation.description
        lastErrorPath: status.lastErrors[0].description
      template: |
        apiVersion: core.gardener.cloud/v1beta1
        kind: Shoot
        metadata:
          name: dati-test-new
          namespace: garden-sap
        spec:
          cloudProfile:
            name: openstack
            kind: CloudProfile
          credentialsBindingName: my-openstack-secret
          region: {{ .Inputs.region }}
          kubernetes:
            version: "{{ .Inputs.k8sVersion }}"
          networking:
            type: calico
            nodes: 10.250.0.0/16
            pods: 100.128.0.0/11
            services: 100.72.0.0/13
          provider:
            type: openstack
            infrastructureConfig:
              apiVersion: openstack.provider.extensions.gardener.cloud/v1alpha1
              kind: InfrastructureConfig
              floatingPoolName: external
              networks:
                workers: 10.250.0.0/19
            controlPlaneConfig:
              apiVersion: openstack.provider.extensions.gardener.cloud/v1alpha1
              kind: ControlPlaneConfig
              loadBalancerProvider: amphora
            workers:
              - name: worker-main
                machine:
                  type: {{ .Inputs.machineType }}
                  image:
                    name: gardenlinux
                    version: "2150.0.0"
                minimum: 1
                maximum: 3
                zones:
                  - {{ .Inputs.zone }}
          maintenance:
            autoUpdate:
              kubernetesVersion: false
              machineImageVersion: false
            timeWindow:
              begin: "220000+0000"
              end: "230000+0000"
          dns:
            providers:
             - type: unmanaged
               primary: true
          hibernation:
            enabled: false
  kubeconfigSource:
    resourceName: shoot
    subResource:
      apiVersion: authentication.gardener.cloud/v1alpha1
      kind: AdminKubeconfigRequest
      subResource: adminkubeconfig
      kubeconfigPath: status.kubeconfig
      expirationPath: status.expirationTimestamp
    validity: 720h
    renewalBefore: 72h
` }}
{{- end }}
