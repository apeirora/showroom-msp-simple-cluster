{{- if .Values.rbac.enabled }}
# RBAC for the controller to access exported resources in the KCP virtual workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: syncagent-resources-access
rules:
  - apiGroups: [apis.kcp.io]
    resources: [apibindings]
    verbs: [get, list, watch]
  - apiGroups:
      - showroom.apeirora.eu
    resources:
      - simpleclusters
      - simpleclusters/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - sshkeys.apeirora.eu
    resources:
      - sshkeys
      - sshkeys/status
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - ubuntu.apeirora.eu
    resources:
      - ubuntuclusters
      - ubuntuclusters/status
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - ""
    resources:
      - namespaces
      - events
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: syncagent-resources-access
subjects:
  - kind: User
    name: cluster-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: syncagent-resources-access
  apiGroup: rbac.authorization.k8s.io
{{- end }}
