rbac:
  enabled: false

# Public host/scheme of the simple-cluster-ui that serves pm-content.json.
# The portal fetches ContentConfiguration.remoteConfiguration.url from here.
PUBLIC_HOST: "localhost"
PUBLIC_SCHEME: "http"

metadata:
  enabled: true
  contentPath: "/pm-content.json"

ord:
  configPath: "/.well-known/open-resource-discovery"

detailViewExtension:
  path: "/ui-extensions/ord/"

branding:
  marketplace:
    title: "Simple Cluster"
    description: "Self-service Kubernetes clusters via the SimpleCluster API (multiple providers available)."
