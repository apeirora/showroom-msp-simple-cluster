syncAgentOperator:
  enabled: true
  apiExportName: simpleclusters.showroom.apeirora.eu
  agentName: simple-cluster-agent
  kcpKubeconfig: pm-kubeconfig
  replicas: 1
  enableLeaderElection: false
  extraFlags:
    - --kcp-kubeconfig=/etc/kcp/kubeconfig
  # Use the same Secret name as kcpKubeconfig when you override these values.
  extraVolumes:
    - name: kcp-credentials
      secret:
        secretName: pm-kubeconfig
        defaultMode: 0444
  extraVolumeMounts:
    - name: kcp-credentials
      mountPath: /etc/kcp
      readOnly: true
  crds:
    enabled: false

publishedResources:
  enabled: true
  namespace: simple-cluster-system
rbac:
  enabled: true
