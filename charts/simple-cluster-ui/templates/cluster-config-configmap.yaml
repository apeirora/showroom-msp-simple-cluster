{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cluster-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simple-cluster-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-ui
data:
  simple-cluster-config.json: |-
{{ toJson .Values.clusterConfig | indent 4 }}
{{- end }}
