{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simple-cluster-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: portal-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "simple-cluster-ui.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-ui
      annotations:
        checksum/portal-config: {{ include (print $.Template.BasePath "/portal-configmap.yaml") . | sha256sum }}
        checksum/cluster-config: {{ include (print $.Template.BasePath "/cluster-config-configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "simple-cluster-ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
          volumeMounts:
            - name: portal-config
              mountPath: /usr/share/nginx/html/pm-content.json
              subPath: pm-content.json
            - name: cluster-config
              mountPath: /usr/share/nginx/html/simple-cluster-config.json
              subPath: simple-cluster-config.json
            {{- if .Values.addonCatalog.enabled }}
            # Mounted as a directory, deliberately without subPath: this file is written
            # by the operator as extensions come and go, and a subPath mount is a copy
            # taken at start-up that never changes again.
            - name: addon-catalog
              mountPath: /usr/share/nginx/html/addons
              readOnly: true
            {{- end }}
            {{- if .Values.ordCatalog.enabled }}
            # Mounted as a directory so kubelet can atomically refresh the files when
            # provider configurations or their availability change.
            - name: ord-catalog
              mountPath: /usr/share/nginx/html/ord
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: portal-config
          configMap:
            name: {{ .Release.Name }}-portal-config
            items:
              - key: pm-content.json
                path: pm-content.json
        - name: cluster-config
          configMap:
            name: {{ .Release.Name }}-cluster-config
            items:
              - key: simple-cluster-config.json
                path: simple-cluster-config.json
        {{- if .Values.addonCatalog.enabled }}
        # Written by simple-cluster-operator, not by this chart, so it may not exist yet
        # (or at all, if the aggregator is off). Optional keeps the pod starting either
        # way; the UI treats a missing file as "no extensions to offer".
        - name: addon-catalog
          configMap:
            name: {{ .Values.addonCatalog.configMapName }}
            optional: true
        {{- end }}
        {{- if .Values.ordCatalog.enabled }}
        - name: ord-catalog
          configMap:
            name: {{ .Values.ordCatalog.configMapName }}
            optional: true
        {{- end }}
{{- end }}
