# Hostname under which the UI (SPA + pm-content.json) is served. Must match the
# PUBLIC_HOST/PUBLIC_SCHEME of the simple-cluster-pm-integration chart so the
# portal's ContentConfiguration.remoteConfiguration.url resolves here.
PUBLIC_HOST: "localhost"
PUBLIC_SCHEME: "http"

tls:
  secretName: ""

ingress:
  extraAnnotations: {}

traefik:
  ingressClass:
    name: ""

imagePullSecrets: []

ui:
  enabled: true
  contentPath: "/pm-content.json"
  # The micro-frontend container image (React + UI5, served by nginx). CI
  # publishes it tagged with the operator release version and `latest`; the
  # chart cannot know the operator version, so it defaults to `latest`. Pin a
  # specific version per environment via the GitOps overlay.
  image:
    repository: ghcr.io/apeirora/simple-cluster-ui
    pullPolicy: IfNotPresent
  resources: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    annotations: {}

# URL of the workspace-aware GraphQL gateway. The Luigi context.crdGatewayApiUrl
# flows into the UI at runtime and overrides this; this value is only a
# fallback used when the portal does not provide one.
graphql:
  url: "/api/kubernetes-graphql-gateway/root/graphql"

branding:
  sidebar:
    title: "Simple Cluster"

# The catalogue of installable extensions, served as /addons/simple-cluster-addons.json.
# Unlike clusterConfig this chart does not author it: simple-cluster-operator aggregates
# what each installed extension publishes, and this only mounts the result. The
# configMapName must match the operator's --addon-catalog-configmap, and the operator
# must write into this release's namespace.
addonCatalog:
  enabled: true
  configMapName: simple-cluster-addons

# Generated by simple-cluster-operator from the installed
# SimpleClusterProviderConfigs. Optional keeps the UI and discovery fallback
# operational while the operator starts or when ORD publication is disabled.
ordCatalog:
  enabled: true
  configMapName: simple-cluster-ord

# Predefined choices surfaced in the create dialog (served as
# simple-cluster-config.json). Editing these tunes the dropdowns without
# rebuilding the container image.
clusterConfig:
  # providerSources drive the LIVE provider drop-down: the create dialog lists
  # the SimpleClusterProviderConfig names advertised by installed provider CRs
  # (status.providerConfigs). Each entry is a provider CR family — when a user
  # installs a provider and creates its CR, that provider appears automatically.
  # Add an entry per provider family the portal should discover.
  providerSources:
    - group: dati.eu
      version: v1alpha1
      listField: Shoots
      label: Dati (Gardener Shoot)
      # providerConfigName is added to the drop-down as soon as this provider's
      # type resolves in the gateway schema (its APIExport is bound), so dati is
      # selectable on install without first creating a Shoot instance.
      providerConfigName: dati
    - group: sap.eu
      version: v1alpha1
      listField: OpenStackShoots
      label: SAP Gardener (OpenStack)
      providerConfigName: sap-gardener-openstack
    - group: sap.eu
      version: v1alpha1
      listField: IronCoreShoots
      label: SAP Gardener (IronCore)
      providerConfigName: sap-gardener-ironcore
    - group: apeiro.eu
      version: v1alpha1
      listField: OpenStackShoots
      label: Apeiro Gardener (OpenStack)
      providerConfigName: apeiro-gardener-openstack
    - group: apeiro.eu
      version: v1alpha1
      listField: IronCoreShoots
      label: Apeiro Gardener (IronCore)
      providerConfigName: apeiro-gardener-ironcore
    - group: cloudferro.eu
      version: v1alpha1
      listField: OpenStackVMs
      label: CloudFerro
      providerConfigName: cloudferro
      namespaced: true
    - group: arsys.eu
      version: v1alpha1
      listField: UbuntuMachines
      label: Arsys (virtual)
      providerConfigName: arsys-virtual
      namespaced: true
  # Key management providers a SimpleClusterProviderConfig admits for
  # SimpleCluster.spec.encryption (apeirora/showroom#470), keyed by provider
  # config name. The portal cannot read the provider config itself (it lives on
  # the MSP cluster), so this mirrors spec.encryptionProviders by hand. Empty
  # means the create dialog offers no encryption control anywhere; the operator
  # refuses a request the provider config does not admit regardless.
  # Example:
  #   encryptionProviders:
  #     cloudferro: [OpenBao]
  encryptionProviders: {}
  # Static fallback provider list, used only when providerSources is empty
  # (legacy deployments / offline). Ignored once providerSources is set.
  providers:
    - cloudferro
    - sap-gardener-ironcore
    - sap-gardener-openstack
    - kind
  cpu:
    - "1"
    - "2"
    - "4"
    - "8"
    - "16"
  memory:
    - "2Gi"
    - "4Gi"
    - "8Gi"
    - "16Gi"
    - "32Gi"
  controlPlane:
    min: 1
    max: 10
    default: 1
  workers:
    min: 1
    max: 10
    default: 1
