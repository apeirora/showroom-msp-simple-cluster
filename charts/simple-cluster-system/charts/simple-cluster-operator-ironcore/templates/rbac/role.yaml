{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: simple-cluster-operator-ironcore-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ironcore.apeirora.eu
  resources:
  - ironcorevms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ironcore.apeirora.eu
  resources:
  - ironcorevms/finalizers
  verbs:
  - update
- apiGroups:
  - ironcore.apeirora.eu
  resources:
  - ironcorevms/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
