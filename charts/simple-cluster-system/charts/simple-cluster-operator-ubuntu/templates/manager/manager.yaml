apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-cluster-operator-ubuntu-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas:  {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        control-plane: controller-manager
        {{- if and .Values.controllerManager.pod .Values.controllerManager.pod.labels }}
        {{- range $key, $value := .Values.controllerManager.pod.labels }}
        {{ $key }}: {{ $value }}
        {{- end }}
        {{- end }}
    spec:
      containers:
        - name: manager
          args:
            - {{ printf "--secret-reference-allowlist=%s" (.Values.secretReferenceAllowlist | default list | toJson) | quote }}
            {{- range .Values.controllerManager.container.args }}
            - {{ . }}
            {{- end }}
            {{- if .Values.openbao.enabled }}
            - {{ printf "--openbao-address=%s" (required "openbao.address is required when openbao.enabled" .Values.openbao.address) | quote }}
            - {{ printf "--openbao-namespace=%s" .Values.openbao.namespace | quote }}
            - {{ printf "--openbao-jwt-mount=%s" .Values.openbao.jwtMount | quote }}
            - {{ printf "--openbao-jwt-role=%s" .Values.openbao.jwtRole | quote }}
            - {{ printf "--openbao-transit-mount=%s" .Values.openbao.transitMount | quote }}
            - {{ printf "--openbao-approle-mount=%s" .Values.openbao.approleMount | quote }}
            - {{ printf "--openbao-plugin-policy=%s" .Values.openbao.pluginPolicy | quote }}
            - "--openbao-token-file=/var/run/secrets/openbao/token"
            {{- if .Values.openbao.caCert }}
            - "--openbao-ca-file=/etc/openbao/ca.pem"
            {{- end }}
            {{- end }}
          command:
            - /manager
          image: {{ .Values.controllerManager.container.image.repository }}:{{ coalesce .Values.global.imageTag .Values.controllerManager.container.image.tag .Chart.AppVersion }}
          {{- if .Values.controllerManager.container.imagePullPolicy }}
          imagePullPolicy: {{ .Values.controllerManager.container.imagePullPolicy }}
          {{- end }}
          {{- if .Values.controllerManager.container.env }}
          env:
            {{- range $key, $value := .Values.controllerManager.container.env }}
            - name: {{ $key }}
              value: {{ $value }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.controllerManager.container.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.controllerManager.container.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.controllerManager.container.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controllerManager.container.securityContext | nindent 12 }}
          {{- if or (and .Values.certmanager.enable .Values.metrics.enable) .Values.openbao.enabled }}
          volumeMounts:
            {{- if and .Values.metrics.enable .Values.certmanager.enable }}
            - name: metrics-certs
              mountPath: /tmp/k8s-metrics-server/metrics-certs
              readOnly: true
            {{- end }}
            {{- if .Values.openbao.enabled }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- if .Values.openbao.caCert }}
            - name: openbao-ca
              mountPath: /etc/openbao
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      securityContext:
        {{- toYaml .Values.controllerManager.securityContext | nindent 8 }}
      serviceAccountName: {{ .Values.controllerManager.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.controllerManager.terminationGracePeriodSeconds }}
      {{- if or (and .Values.certmanager.enable .Values.metrics.enable) .Values.openbao.enabled }}
      volumes:
        {{- if and .Values.metrics.enable .Values.certmanager.enable }}
        - name: metrics-certs
          secret:
            secretName: metrics-server-cert
        {{- end }}
        {{- if .Values.openbao.enabled }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.openbao.tokenAudience | quote }}
                  expirationSeconds: {{ .Values.openbao.tokenExpirationSeconds }}
        {{- if .Values.openbao.caCert }}
        - name: openbao-ca
          configMap:
            name: simple-cluster-operator-ubuntu-openbao-ca
        {{- end }}
        {{- end }}
      {{- end }}
