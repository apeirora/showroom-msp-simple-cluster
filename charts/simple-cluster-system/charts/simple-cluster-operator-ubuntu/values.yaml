# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: controller
      tag: latest
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: simple-cluster-operator-ubuntu-controller-manager

# [OpenBao KMS]: SimpleCluster encryption at rest (apeirora/showroom#470).
# When enabled, the operator logs in to the platform's SimpleCluster KMS
# tenancy with its own ServiceAccount token (projected, audience below) and
# prepares every control-plane host of an UbuntuCluster that sets
# spec.encryption. Disabled, such clusters are refused (Phase=Failed), never
# provisioned unencrypted.
openbao:
  enabled: false
  # https:// URL of the OpenBao serving the tenancy.
  address: ""
  # OpenBao namespace of the tenancy; "" is the root namespace.
  namespace: simple-cluster
  # Audience the JWT auth role expects in the operator's token.
  tokenAudience: openbao
  # Lifetime of the projected token; the kubelet rotates it well before.
  tokenExpirationSeconds: 3600
  # Mount and role names as created by the tenancy (showroom-infra).
  jwtMount: simplecluster-kms-jwt
  jwtRole: simplecluster-operator
  transitMount: simplecluster-kms
  approleMount: simplecluster-kms-approle
  pluginPolicy: sc-kms-plugin
  # Extra PEM CA bundle for the address, when its certificate is not
  # publicly trusted. Also handed to the hosts' plugins.
  caCert: ""

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# Exact operator-approved Secret references. Purposes: use, copy, write.
secretReferenceAllowlist: []
