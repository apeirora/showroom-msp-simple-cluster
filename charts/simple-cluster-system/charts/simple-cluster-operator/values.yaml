# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: controller
      # Empty pins the image to the chart appVersion, which the release
      # pipeline stamps to the published image version ("chart X.Y.Z pulls
      # image X.Y.Z", see .github/workflows/publish.yml). A literal default
      # here would win that coalesce and silently degrade installs to an
      # unpinned :latest.
      tag: ""
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      # The manager never writes to its root filesystem: the KCP kubeconfig
      # and the metrics certs arrive on read-only mounts and the
      # Secret-reference allowlist is a flag value (no temp-file use in the
      # operator code). A landscape that mounts more writable state into the
      # container can override this value.
      readOnlyRootFilesystem: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: simple-cluster-operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true
  # Provider self-grant: any ClusterRole matching matchLabels below is merged,
  # content-unbounded, into the operator identity shared by all tenants
  # (self-grant hazard, see templates/rbac/provider_resources_role.yaml).
  # Pin the selector with an extra discriminator label so only ClusterRoles
  # you control match, or set enable=false to rely on the manager role alone.
  # matchLabels must stay a non-empty map (an empty selector would match every
  # ClusterRole in the cluster); the render fails on it, enable=false is the
  # supported disable path.
  aggregation:
    enable: true
    matchLabels:
      showroom.apeirora.eu/aggregate-to-simple-cluster-operator: "true"

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [ADDON CATALOGUE]: extensions (e.g. Crypto Broker) publish a ConfigMap in
# sourceNamespace saying which label switches them on. The operator collects those into
# one ConfigMap the create dialog reads, so offering a new extension is an install
# rather than an edit here. Disable on a landscape without the portal UI.
addonCatalog:
  enable: true
  # Where the aggregate is written. Defaults to the release namespace, which is where
  # the UI runs.
  namespace: ""
  configMapName: simple-cluster-addons
  sourceNamespace: kube-system
  interval: 2m

# [ORD CATALOGUE]: descriptive metadata generated from the installed SCPCs.
# The UI mounts this ConfigMap and exposes the standard ORD discovery routes.
ordCatalog:
  enable: true
  namespace: ""
  configMapName: simple-cluster-ord
  interval: 2m

# Exact operator-approved Secret references. Purposes: use, copy, write.
secretReferenceAllowlist: []

# Use the existing provider credential for account resources. No account credentials are issued.
kcpAccount:
  enabled: true
  secretName: pm-kubeconfig
  apiExportName: simpleclusters.showroom.apeirora.eu
