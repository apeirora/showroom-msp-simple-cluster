{{- if not .Values.kcpAccount.enabled }}
{{- fail "kcpAccount.enabled must be true: child resources use only account workspaces" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-cluster-operator-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas:  {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        control-plane: controller-manager
        {{- if and .Values.controllerManager.pod .Values.controllerManager.pod.labels }}
        {{- range $key, $value := .Values.controllerManager.pod.labels }}
        {{ $key }}: {{ $value }}
        {{- end }}
        {{- end }}
    spec:
      containers:
        - name: manager
          args:
            {{- if .Values.kcpAccount.enabled }}
            - --kcp-kubeconfig=/etc/kcp/kubeconfig
            - --kcp-api-export={{ .Values.kcpAccount.apiExportName }}
            {{- end }}
            - {{ printf "--secret-reference-allowlist=%s" (.Values.secretReferenceAllowlist | default list | toJson) | quote }}
            {{- range .Values.controllerManager.container.args }}
            - {{ . }}
            {{- end }}
            {{- if .Values.addonCatalog.enable }}
            {{- /* Where the aggregated catalogue is written; the UI mounts it from
                   there. Empty (the flag's default) turns the aggregator off, so a
                   landscape without the portal pays nothing for it. */}}
            - --addon-catalog-namespace={{ .Values.addonCatalog.namespace | default .Release.Namespace }}
            - --addon-catalog-configmap={{ .Values.addonCatalog.configMapName }}
            - --addon-catalog-source-namespace={{ .Values.addonCatalog.sourceNamespace }}
            - --addon-catalog-interval={{ .Values.addonCatalog.interval }}
            {{- end }}
            {{- if .Values.ordCatalog.enable }}
            - --ord-catalog-namespace={{ .Values.ordCatalog.namespace | default .Release.Namespace }}
            - --ord-catalog-configmap={{ .Values.ordCatalog.configMapName }}
            - --ord-catalog-system-version={{ coalesce .Values.global.imageTag .Chart.AppVersion }}
            - --ord-catalog-interval={{ .Values.ordCatalog.interval }}
            {{- end }}
          command:
            - /manager
          image: {{ .Values.controllerManager.container.image.repository }}:{{ coalesce .Values.global.imageTag .Values.controllerManager.container.image.tag .Chart.AppVersion }}
          {{- if .Values.controllerManager.container.imagePullPolicy }}
          imagePullPolicy: {{ .Values.controllerManager.container.imagePullPolicy }}
          {{- end }}
          {{- if .Values.controllerManager.container.env }}
          env:
            {{- range $key, $value := .Values.controllerManager.container.env }}
            - name: {{ $key }}
              value: {{ $value }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.controllerManager.container.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.controllerManager.container.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.controllerManager.container.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controllerManager.container.securityContext | nindent 12 }}
          {{- if or .Values.kcpAccount.enabled (and .Values.certmanager.enable .Values.metrics.enable) }}
          volumeMounts:
            {{- if .Values.kcpAccount.enabled }}
            - name: kcp-credentials
              mountPath: /etc/kcp
              readOnly: true
            {{- end }}
            {{- if and .Values.metrics.enable .Values.certmanager.enable }}
            - name: metrics-certs
              mountPath: /tmp/k8s-metrics-server/metrics-certs
              readOnly: true
            {{- end }}
          {{- end }}
      securityContext:
        {{- toYaml .Values.controllerManager.securityContext | nindent 8 }}
      serviceAccountName: {{ .Values.controllerManager.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.controllerManager.terminationGracePeriodSeconds }}
      {{- if or .Values.kcpAccount.enabled (and .Values.certmanager.enable .Values.metrics.enable) }}
      volumes:
        {{- if .Values.kcpAccount.enabled }}
        - name: kcp-credentials
          secret:
            secretName: {{ .Values.kcpAccount.secretName }}
            defaultMode: 0444
        {{- end }}
        {{- if and .Values.metrics.enable .Values.certmanager.enable }}
        - name: metrics-certs
          secret:
            secretName: metrics-server-cert
        {{- end }}
      {{- end }}
