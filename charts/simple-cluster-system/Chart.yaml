apiVersion: v2
name: simple-cluster-system
description: Umbrella chart that deploys simple-cluster-operator and its
  per-target companions (kind / openstack / ubuntu) into a single
  namespace. The sub-charts under `charts/` are regenerated from
  each operator's `kubebuilder edit --plugins=helm/v1-alpha` output
  by `scripts/regen-helm-charts.sh`.
type: application
version: 0.7.0
appVersion: "0.1.0"
dependencies:
  - name: simple-cluster-operator
    version: 0.3.2
  - name: kind-cluster-operator
    version: 0.3.0
  - name: simple-cluster-operator-openstack
    version: 0.3.0
  - name: simple-cluster-operator-ubuntu
    version: 0.3.0
  - name: sshkey-operator
    version: 0.1.0
