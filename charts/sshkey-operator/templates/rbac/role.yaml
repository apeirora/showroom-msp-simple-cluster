{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: sshkey-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys/finalizers
  verbs:
  - update
- apiGroups:
  - sshkeys.apeirora.eu
  resources:
  - sshkeys/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
