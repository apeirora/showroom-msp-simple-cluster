---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ubuntumachineclaims.ubuntumachines.apeirora.eu
spec:
  group: ubuntumachines.apeirora.eu
  names:
    kind: UbuntuMachineClaim
    listKind: UbuntuMachineClaimList
    plural: ubuntumachineclaims
    shortNames:
    - umc
    singular: ubuntumachineclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.machine.name
      name: Machine
      type: string
    - jsonPath: .spec.externalAddressRequired
      name: External
      type: boolean
    - jsonPath: .spec.required.cpu
      name: CPU
      type: string
    - jsonPath: .spec.required.memory
      name: Memory
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UbuntuMachineClaim is the consumer-facing CR: "give me one machine".
          Modeled after PersistentVolumeClaim — one claim binds one
          UbuntuMachine. Independent of any cluster technology — the bound
          machine can be used for anything reachable over SSH.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UbuntuMachineClaimSpec is the consumer's ask: "give me one machine
              that fits these resource requirements". Mirrors PVC: one claim binds
              exactly one UbuntuMachine. The claim only ever resolves within its
              own namespace.
            properties:
              externalAddressRequired:
                description: |-
                  ExternalAddressRequired filters the candidate set to machines
                  whose spec.externalAddress is non-empty. Use this for control-plane
                  claims where the consumer needs to reach the host directly.
                type: boolean
              required:
                description: |-
                  Required is the per-machine resource floor. A machine is eligible
                  iff `capacity.cpu >= required.cpu && capacity.memory >= required.memory`.
                  Zero / omitted means no constraint on that dimension.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the advertised CPU (e.g. "2", "500m").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the advertised memory (e.g. "2Gi").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              selector:
                additionalProperties:
                  type: string
                description: |-
                  Selector restricts the candidate UbuntuMachines to those whose labels
                  match all of these key/value pairs (equality-based matchLabels).
                  Empty selects from the whole pool. Use this to pin a cluster to a
                  subset of the machine pool (e.g. a rack, zone, or tenant).
                type: object
            type: object
          status:
            description: UbuntuMachineClaimStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              machine:
                description: |-
                  Machine is the embedded snapshot of the bound UbuntuMachine.
                  Nil when Pending.
                properties:
                  address:
                    description: Address echoes UbuntuMachine.spec.address.
                    type: string
                  externalAddress:
                    description: ExternalAddress echoes UbuntuMachine.spec.externalAddress.
                    type: string
                  name:
                    description: Name is the bound UbuntuMachine's metadata.name.
                    type: string
                required:
                - address
                - name
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending until a machine is bound, then Ready.
                enum:
                - Pending
                - Ready
                type: string
              sshSecretRef:
                description: |-
                  SSHSecretRef points at the Secret (in the claim's namespace) that
                  holds the per-claim SSH private key under `ssh-privatekey`.
                  Connect as root using this key.
                  Nil until the key has been injected into the machine.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
