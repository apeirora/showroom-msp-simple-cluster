    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UbuntuMachine is one pre-existing host an administrator registers into
          the pool. Consumers ask for machines via UbuntuMachineClaim — the
          operator never touches the host itself.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UbuntuMachineSpec describes a pre-existing Ubuntu host an administrator
              has registered into the pool. The operator does not provision or modify
              the underlying machine — it only tracks ownership.
            properties:
              address:
                description: Address is the host's internal IP/DNS name. Required.
                minLength: 1
                type: string
              adminSSH:
                description: |-
                  AdminSSH is the operator's internal credential for managing the machine.
                  The operator uses this to inject/remove per-claim public keys.
                  Consumers never see this credential.
                properties:
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef points at a Secret carrying the login password
                      under the `password` data key (the standard `kubernetes.io/basic-auth`
                      shape). Namespace must be given explicitly.
                    properties:
                      name:
                        description: name is unique within a namespace to reference
                          a secret resource.
                        type: string
                      namespace:
                        description: namespace defines the space within which the
                          secret name must be unique.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  port:
                    description: Port is the SSH port. Defaults to 22 when unset.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  privateKeySecretRef:
                    description: |-
                      PrivateKeySecretRef points at a Secret carrying the SSH private key
                      under the `ssh-privatekey` data key (the standard
                      `kubernetes.io/ssh-auth` shape). The UbuntuMachine is cluster-scoped,
                      so the Secret's namespace must be given explicitly.
                    properties:
                      name:
                        description: name is unique within a namespace to reference
                          a secret resource.
                        type: string
                      namespace:
                        description: namespace defines the space within which the
                          secret name must be unique.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  user:
                    description: User is the sudo-capable login (e.g. "ubuntu", "eouser",
                      "root").
                    minLength: 1
                    type: string
                required:
                - user
                type: object
                x-kubernetes-validations:
                - message: exactly one of privateKeySecretRef or passwordSecretRef
                    must be set
                  rule: has(self.privateKeySecretRef) != has(self.passwordSecretRef)
              capacity:
                description: |-
                  Capacity advertises the resources this machine can satisfy. Used
                  by the claim binder: a claim's `required.cpu/memory` must be
                  `<=` capacity for the machine to be eligible. Zero (or omitted)
                  values mean "unconstrained" and match any request.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the advertised CPU (e.g. "2", "500m").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the advertised memory (e.g. "2Gi").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              externalAddress:
                description: |-
                  ExternalAddress is the host's public IP/DNS name when one exists.
                  Required for machines that consumers want to reach directly
                  (claims with `externalAddressRequired: true` will only bind these).
                type: string
            required:
            - address
            - adminSSH
            type: object
          status:
            description: UbuntuMachineStatus is the observed state.
            properties:
              boundClaimRef:
                description: |-
                  BoundClaimRef points at the UbuntuMachineClaim that holds this
                  machine. Cleared when the claim is deleted. Carries the namespace
                  because the machine is cluster-scoped while claims are namespaced.
                properties:
                  name:
                    description: Name is the claim's metadata.name.
                    type: string
                  namespace:
