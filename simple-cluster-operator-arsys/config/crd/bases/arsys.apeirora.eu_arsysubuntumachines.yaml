---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: arsysubuntumachines.arsys.apeirora.eu
spec:
  group: arsys.apeirora.eu
  names:
    kind: ArsysUbuntuMachine
    listKind: ArsysUbuntuMachineList
    plural: arsysubuntumachines
    shortNames:
    - aum
    singular: arsysubuntumachine
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.server.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.provisioningPercent
      name: Progress
      type: integer
    - jsonPath: .status.serverID
      name: Server
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.serverName
      name: Machine
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ArsysUbuntuMachine orders a dedicated server from Arsys CloudBuilder and
          registers it as a cluster-scoped UbuntuMachine (owned by this CR). The
          server is deleted when the CR is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ArsysUbuntuMachineSpec describes a dedicated server to order from Arsys
              CloudBuilder and the UbuntuMachine to register once it is up.
            properties:
              passwordSecretRef:
                description: |-
                  PasswordSecretRef names the Secret the operator WRITES the server's
                  generated root password into after provisioning (kubernetes.io/basic-auth,
                  keys `username`/`password`). The operator creates it if absent; the
                  UbuntuMachine references it for SSH. Namespaced.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              server:
                description: |-
                  Server is the dedicated-server order, mapped 1:1 onto the Arsys
                  `POST /servers` request.
                properties:
                  applianceID:
                    description: ApplianceID selects the OS image/appliance (an Ubuntu
                      appliance).
                    minLength: 1
                    type: string
                  baremetalModelID:
                    description: |-
                      BaremetalModelID picks the bare-metal model (e.g. "BMC_S") for a
                      dedicated order. When omitted the operator auto-selects the smallest
                      ENABLED model meeting vcore/ram that is available in datacenterID.
                      List with GET /servers/baremetal_models.
                    type: string
                  coresPerProcessor:
                    description: CoresPerProcessor is the core/processor layout (cloud
                      only).
                    format: int32
                    type: integer
                  datacenterID:
                    description: DatacenterID selects the datacenter the server is
                      created in.
                    minLength: 1
                    type: string
                  disk:
                    description: Disk is the main disk size in GiB (cloud only).
                    format: int32
                    type: integer
                  name:
                    description: Name is the server name at Arsys. Defaults to metadata.name.
                    maxLength: 128
                    type: string
                  publicKeys:
                    description: |-
                      PublicKeys are SSH public keys pushed to the server at order time.
                      Usually empty — keys are managed in the Arsys CloudPanel.
                    items:
                      type: string
                    type: array
                  ram:
                    description: |-
                      RAM is memory in GiB: the exact size for a cloud order, or the minimum
                      RAM to match when auto-selecting a dedicated model.
                    format: int32
                    type: integer
                  sshKeyRef:
                    description: |-
                      SSHKeyRef points at the SSH public key source, considered after
                      PublicKeys. It accepts an SSHKey custom resource (apiGroup
                      sshkeys.apeirora.eu, kind SSHKey) or a Secret (core apiGroup, kind
                      Secret) whose values are read as public-key strings (private-key
                      material skipped). Only one key is injected. namespace is optional
                      and defaults to the machine's namespace.
                    properties:
                      apiGroup:
                        description: |-
                          APIGroup is the group for the resource being referenced.
                          If APIGroup is not specified, the specified Kind must be in the core API group.
                          For any other third-party types, APIGroup is required.
                        type: string
                      kind:
                        description: Kind is the type of resource being referenced
                        type: string
                      name:
                        description: Name is the name of resource being referenced
                        type: string
                      namespace:
                        description: |-
                          Namespace is the namespace of resource being referenced
                          Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                          (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  type:
                    default: dedicated
                    description: Type selects a dedicated (bare-metal) or cloud (virtual)
                      server.
                    enum:
                    - cloud
                    - dedicated
                    type: string
                  vcore:
                    description: |-
                      VCore is the number of cores: the exact size for a cloud order, or the
                      minimum cores to match when auto-selecting a dedicated model.
                    format: int32
                    type: integer
                required:
                - applianceID
                - datacenterID
                type: object
                x-kubernetes-validations:
                - message: dedicated requires baremetalModelID, or vcore and ram to
                    auto-select the smallest model
                  rule: self.type != 'dedicated' || (has(self.baremetalModelID) &&
                    self.baremetalModelID != '') || (has(self.vcore) && has(self.ram))
                - message: vcore, ram and disk are required when type is cloud
                  rule: self.type != 'cloud' || (has(self.vcore) && has(self.ram)
                    && has(self.disk))
              ssh:
                description: SSH is the login the resulting UbuntuMachine advertises.
                properties:
                  user:
                    description: User is the sudo-capable login (e.g. "root", "ubuntu").
                    minLength: 1
                    type: string
                required:
                - user
                type: object
              tokenSecretRef:
                description: |-
                  TokenSecretRef points at the Secret holding the Arsys API token under
                  the `token` key (sent as X-TOKEN). You provide this Secret; the
                  operator only reads it. Namespaced because this CR is cluster-scoped.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - passwordSecretRef
            - server
            - ssh
            - tokenSecretRef
            type: object
          status:
            description: ArsysUbuntuMachineStatus is the observed state.
            properties:
              address:
                description: Address is the server's public IP once assigned.
                type: string
              baremetalModelID:
                description: |-
                  BaremetalModelID is the dedicated model the server was ordered with.
                  When spec.server.baremetalModelID was empty this is the auto-selected
                  smallest model that met vcore/ram in the datacenter.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              machineRef:
                description: MachineRef is the name of the UbuntuMachine the operator
                  created.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the coarse state.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              provisioningPercent:
                description: |-
                  ProvisioningPercent is the server build progress reported by the Arsys API (0-100).
                  Cleared once the server reaches Ready.
                type: integer
              selectedCores:
                description: |-
                  SelectedCores and SelectedRAMGB are the auto-selected model's actual
                  size, mirrored onto the UbuntuMachine capacity. Unset for explicit-model
                  or cloud orders.
                format: int32
                type: integer
              selectedRAMGB:
                format: int32
                type: integer
              serverID:
                description: ServerID is the Arsys server id, set once the order is
                  accepted.
                type: string
              serverName:
                description: |-
                  ServerName is the Arsys server name used for this CR. Written once before
                  the first create attempt so it remains stable across retries.
                type: string
              transientErrors:
                description: |-
                  TransientErrors counts consecutive transient errors (e.g. REPEATED_PUBLIC_NAME).
                  Reset to zero on the first successful reconcile; escalates to Failed once it
                  reaches the failure threshold.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
