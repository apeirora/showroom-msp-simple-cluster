image:
  repository: ghcr.io/apeirora/dati-provider-operator
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

leaderElect: true

extraEnv: []

scpc:
  kubeconfig:
    # Default source of the Gardener kubeconfig each SCPC targets:
    #   global — one shared admin-managed Secret (below). Default.
    #   kcp    — per-client kubeconfig brought from the KCP workspace and
    #            looked up in the Shoot's own namespace (client.secretName).
    # A Shoot may override this per-object via the annotation
    # dati.gardener/kubeconfig-source.
    source: global
    global:
      secretName: gardener-dati-kubeconfig
      secretNamespace: dati-provider
    client:
      # Secret name expected in the Shoot's namespace in 'kcp' mode; the
      # sync agent delivers the client's workspace kubeconfig under this name
      # (see datiprovider-sync-agent publishedResources.clientKubeconfig).
      secretName: dati-gardener-kubeconfig

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
