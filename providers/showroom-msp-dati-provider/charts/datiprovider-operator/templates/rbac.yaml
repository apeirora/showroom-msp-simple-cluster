apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dati-provider-controller-manager
  labels:
    {{- include "datiprovider-operator.labels" . | nindent 4 }}
rules:
{{ .Files.Get "files/rbac-rules.yaml" | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dati-provider-controller-manager
  labels:
    {{- include "datiprovider-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dati-provider-controller-manager
subjects:
- kind: ServiceAccount
  name: dati-provider-controller-manager
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dati-provider-controller-manager-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datiprovider-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dati-provider-controller-manager-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datiprovider-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dati-provider-controller-manager-leader-election
subjects:
  - kind: ServiceAccount
    name: dati-provider-controller-manager
    namespace: {{ .Release.Namespace }}
