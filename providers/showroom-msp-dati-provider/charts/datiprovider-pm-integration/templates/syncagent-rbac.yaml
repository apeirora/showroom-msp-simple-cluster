{{- if .Values.rbac.enabled }}
# RBAC for the sync agent to access exported resources in the KCP virtual workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datiprovider-syncagent-resources-access
rules:
  - apiGroups:
      - dati.gardener
    resources:
      - shoots
      - shoots/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
      - events
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datiprovider-syncagent-resources-access
subjects:
  - kind: User
    name: cluster-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: datiprovider-syncagent-resources-access
  apiGroup: rbac.authorization.k8s.io
{{- end }}
