{{- if .Values.publishedResources.enabled }}
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-dati-shoots
  namespace: {{ .Values.publishedResources.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: datiprovider-sync-agent
    app.kubernetes.io/component: portal-integration
spec:
  resource:
    kind: Shoot
    apiGroup: dati.gardener
    version: v1alpha1
  projection:
    # Namespaced on the service cluster, cluster-scoped in the KCP workspace.
    scope: Cluster
  naming:
    namespace: "{{`{{ .ClusterName }}`}}"
    name: "{{`{{ .Object.metadata.name }}`}}"
  related:
    # Mirror the kubeconfig Secret written by the operator back into the
    # consuming account workspace so the portal can download it.
    - identifier: kubeconfig-secret
      origin: service
      kind: Secret
      object:
        reference:
          path: status.kubeconfigSecretRef.name
  {{- if .Values.publishedResources.clientKubeconfig.enabled }}
    # kubeconfig source 'kcp': mirror the client-provided kubeconfig Secret
    # from the KCP workspace down into the Shoot's namespace on the service
    # cluster, where the operator reads it as the SCPC target.
    - identifier: client-kubeconfig
      origin: kcp
      kind: Secret
      object:
        # The Shoot is projected cluster-scoped in KCP, so the related object's
        # namespace must be set explicitly. Destination (service-cluster)
        # namespace is the Shoot's namespace (the ClusterName template below).
        # NOTE: the source-side (KCP) namespace mapping for a cluster-scoped
        # primary must be validated against a live api-syncagent before relying
        # on this in production.
        namespace:
          template:
            template: "{{`{{ .ClusterName }}`}}"
        template:
          template: {{ .Values.publishedResources.clientKubeconfig.secretName | quote }}
  {{- end }}
{{- end }}
