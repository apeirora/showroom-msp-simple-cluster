apiVersion: dati.gardener/v1alpha1
kind: Shoot
metadata:
  name: dati
# spec is the Gardener Shoot manifest, as text, used for the cluster this CR
# provisions. It may contain the template placeholders the SCPC templates use
# ({{ .Inputs.* }}, {{ .SC.* }}), rendered with the flavor defaults. Empty spec
# selects the operator's built-in default template.
spec: |
  apiVersion: core.gardener.cloud/v1beta1
  kind: Shoot
  metadata:
    name: placeholder
    namespace: garden-sap
  spec:
    region: {{ .Inputs.region }}
    provider:
      type: openstack
      workers:
        - name: worker-main
          machine:
            type: {{ .Inputs.machineType }}
          minimum: {{ .SC.workers.min }}
          maximum: {{ .SC.workers.max }}
