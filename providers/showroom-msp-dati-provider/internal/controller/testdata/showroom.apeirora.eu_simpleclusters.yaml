---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: simpleclusters.showroom.apeirora.eu
spec:
  group: showroom.apeirora.eu
  names:
    kind: SimpleCluster
    listKind: SimpleClusterList
    plural: simpleclusters
    shortNames:
    - simc
    singular: simplecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.providerConfigRef.name
      name: SCPC
      type: string
    - jsonPath: .status.cp
      name: CP
      type: string
    - jsonPath: .status.wkr
      name: WKR
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.kubeconfigSecretRef.name
      name: Kubeconfig
      type: string
    - jsonPath: .status.kubeconfigExpiresAt
      name: Kubeconfig Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SimpleCluster is the user-facing namespaced cluster request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SimpleClusterSpec defines the desired state of SimpleCluster.
            properties:
              controlPlane:
                description: |-
                  ControlPlane describes the control-plane pool. Optional: providers like
                  Gardener manage the CP themselves and ignore this. When set, exposed as
                  .SC.controlPlane.{nodes,requested.{cpu,memory}} in templates.
                properties:
                  nodes:
                    description: |-
                      Nodes is the control-plane node count. Typical values: 1 (dev), 3 (HA).
                      Surfaced as .SC.controlPlane.nodes.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  requested:
                    description: |-
                      Requested is the per-node resource ask. Templates translate this to
                      a machine type / VM size / flavor.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        description: CPU is the requested CPU per node (e.g. "16",
                          "500m").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Memory is the requested memory per node (e.g.
                          "32Gi", "32GB").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - nodes
                - requested
                type: object
              inputs:
                additionalProperties:
                  type: string
                description: |-
                  Inputs are per-cluster overrides. Every key MUST be declared in
                  SCPC.spec.inputs; unknown keys are rejected. Keys left unset fall back
                  to the SCPC declaration's default.
                type: object
              kubeconfigRenewalBefore:
                description: KubeconfigRenewalBefore overrides SCPC.kubeconfigSource.renewalBefore
                  for this SC.
                type: string
              kubeconfigValidity:
                description: KubeconfigValidity overrides SCPC.kubeconfigSource.validity
                  for this SC.
                type: string
              providerConfigRefs:
                description: |-
                  ProviderConfigRefs is the ordered list of SCPC candidates by name. The
                  operator picks one and records the choice in status.providerConfigRef;
                  the locked choice is then immune to spec edits. v0.x picks the first
                  entry; future revisions will probe SCPC reachability/capacity.
                items:
                  type: string
                minItems: 1
                type: array
              resources:
                description: |-
                  Resources are manifests applied to the provisioned cluster once it is
                  Ready, using the synced kubeconfig. Best-effort add-ons: each one's
                  outcome is reported in a status condition of type "Resource-<name>",
                  and a failure to apply never blocks Phase=Ready.
                items:
                  description: |-
                    ClusterResource is a raw manifest applied to the cluster a SimpleCluster
                    provisions, after it becomes Ready.
                  properties:
                    content:
                      description: |-
                        Content is a single Kubernetes object manifest as YAML. apiVersion,
                        kind and metadata.name are required.
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Name identifies this resource and is used as the suffix of its apply
                        condition ("Resource-<name>"). Must be DNS-label-safe.
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - content
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workers:
                description: |-
                  Workers describes the worker pool sizing and per-worker resources.
                  Exposed to templates as
                  .SC.workers.{nodes,min,max,autoscaling,requested.{cpu,memory}}.
                properties:
                  autoscaling:
                    description: |-
                      Autoscaling sizes the worker pool as a Min/Max range the provider
                      scales within. Only providers with a native autoscaler honor the
                      range; others provision Min and the AutoscalingSupported condition
                      reports the limitation. Surfaced as .SC.workers.{min,max} plus the
                      boolean .SC.workers.autoscaling; .SC.workers.nodes mirrors Min for
                      templates that predate the range form. Mutually exclusive with Nodes.
                    properties:
                      max:
                        description: Max is the maximum worker count. Surfaced as
                          .SC.workers.max.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      min:
                        description: Min is the minimum worker count. Surfaced as
                          .SC.workers.min.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    required:
                    - max
                    - min
                    type: object
                    x-kubernetes-validations:
                    - message: max must be >= min
                      rule: self.max >= self.min
                  nodes:
                    description: |-
                      Nodes is the fixed worker count. Surfaced as .SC.workers.nodes.
                      Mutually exclusive with Autoscaling.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  requested:
                    description: |-
                      Requested is the per-worker resource ask. Templates surface these as
                      the worker machine type / VM size / replica resources.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        description: CPU is the requested CPU per node (e.g. "16",
                          "500m").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Memory is the requested memory per node (e.g.
                          "32Gi", "32GB").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - requested
                type: object
                x-kubernetes-validations:
                - message: either nodes or autoscaling must be set
                  rule: has(self.nodes) || has(self.autoscaling)
                - message: nodes and autoscaling are mutually exclusive
                  rule: '!(has(self.nodes) && has(self.autoscaling))'
            required:
            - providerConfigRefs
            - workers
            type: object
          status:
            description: SimpleClusterStatus defines the observed state of SimpleCluster.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cp:
                description: |-
                  CP is "<readyControlPlanes>/<declaredControlPlanes>" — surfaced
                  as the CP printer column (e.g. "1/3"). "-/-" when the SCPC owns
                  the control plane (spec.controlPlane is omitted).
                type: string
              kubeconfig:
                description: |-
                  Kubeconfig is the raw NC kubeconfig, mirrored from the Secret referenced
                  by KubeconfigSecretRef. It is duplicated here so the generic portal
                  detail view (which can only read fields of the SimpleCluster itself, not
                  a separate Secret) can surface it for copy/download. It is readable by
                  anyone with get access to this SimpleCluster — the same audience that can
                  already read the Secret in the account namespace.
                type: string
              kubeconfigExpiresAt:
                description: KubeconfigExpiresAt is the expiry time of the embedded
                  credential.
                format: date-time
                type: string
              kubeconfigIssuedAt:
                description: KubeconfigIssuedAt is the issuance time of the embedded
                  credential.
                format: date-time
                type: string
              kubeconfigSecretRef:
                description: KubeconfigSecretRef points at the Secret in SC.namespace
                  holding NC's kubeconfig.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              nodes:
                description: |-
                  Nodes lists the control-plane and worker nodes of the provisioned
                  cluster (NC) with their addresses, read live over the synced kubeconfig.
                  Populated best-effort once the kubeconfig is available; empty until then
                  and never affects Phase.
                items:
                  description: |-
                    NodeStatus is one node of the provisioned cluster (NC), read live over the
                    synced kubeconfig. Surfaced so users can see the cluster's machines and how
                    to reach them without fetching the kubeconfig themselves.
                  properties:
                    externalIP:
                      description: |-
                        ExternalIP is the node's ExternalIP address. Empty when the cluster does
                        not advertise one (e.g. nodes only reachable on a private network).
                      type: string
                    internalIP:
                      description: InternalIP is the node's InternalIP address.
                      type: string
                    name:
                      description: Name is the Kubernetes node name.
                      type: string
                    ready:
                      description: Ready reflects the node's Ready condition.
                      type: boolean
                    role:
                      description: Role is "control-plane" or "worker", derived from
                        the node's role labels.
                      type: string
                  required:
                  - name
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the aggregate state machine across Resources:
                    Ready        - every Resource is Ready.
                    Failed       - at least one Resource is Failed.
                    Provisioning - otherwise (at least one is not yet Ready).
                    Deleting     - SC.deletionTimestamp set.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - Deleting
                - NoHardware
                type: string
              providerConfigRef:
                description: |-
                  ProviderConfigRef is locked at first reconcile so SCPC changes do not
                  migrate resources mid-flight.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              resources:
                description: |-
                  Resources is per-ResourceSpec status, keyed by Name. Populated as the
                  DAG progresses.
                items:
                  description: |-
                    ResourceStatus mirrors the live state of one node in the SCPC's DAG into SC.
                    For repeated ResourceSpecs (ResourceSpec.Repeat set) the per-index detail
                    lives in Instances and the top-level Phase/Reason/Message is the aggregate.
                  properties:
                    gvk:
                      description: GVK is the resolved GroupVersionKind of R.
                      type: string
                    instances:
                      description: |-
                        Instances lists per-index state when the ResourceSpec is repeated.
                        Empty for non-repeated ResourceSpecs.
                      items:
                        description: InstanceStatus is one R-object's state when its
                          ResourceSpec is repeated.
                        properties:
                          index:
                            description: Index is the 0-based iteration this entry
                              tracks.
                            format: int32
                            type: integer
                          lastError:
                            description: LastError mirrors a human-readable error
                              string from R.
                            type: string
                          lastOperation:
                            description: LastOperation mirrors a human-readable progress
                              string from R.
                            type: string
                          phase:
                            description: Phase is this instance's coarse state.
                            enum:
                            - Pending
                            - Provisioning
                            - Ready
                            - Failed
                            - Deleting
                            - NoHardware
                            type: string
                          targetName:
                            description: TargetName is the name of this R-object on
                              the target cluster.
                            type: string
                          targetNamespace:
                            description: TargetNamespace is the namespace of this
                              R-object.
                            type: string
                        required:
                        - index
                        - targetName
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - index
                      x-kubernetes-list-type: map
                    lastError:
                      description: LastError mirrors a human-readable error string
                        from R itself.
                      type: string
                    lastOperation:
                      description: LastOperation mirrors a human-readable progress
                        string from R itself.
                      type: string
                    message:
                      description: |-
                        Message is the operator's human-readable detail for Reason
                        (e.g. "waiting on: cp, service").
                      type: string
                    name:
                      description: Name matches ResourceSpec.Name.
                      type: string
                    phase:
                      description: |-
                        Phase is this resource's coarse state. For repeated specs it is
                        aggregated across Instances (Ready iff all instances Ready; Failed
                        if any instance Failed; otherwise Provisioning/Pending).
                      enum:
                      - Pending
                      - Provisioning
                      - Ready
                      - Failed
                      - Deleting
                      - NoHardware
                      type: string
                    reason:
                      description: Reason is the operator's per-resource state code,
                        narrowing Phase.
                      enum:
                      - WaitingForDependencies
                      - Creating
                      - Provisioning
                      - Ready
                      - Failed
                      - Deleting
                      type: string
                    targetName:
                      description: |-
                        TargetName is the name of R on the target cluster. Empty when the
                        ResourceSpec is repeated; see Instances for per-index names.
                      type: string
                    targetNamespace:
                      description: TargetNamespace is the namespace of R on the target
                        cluster.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              targetCluster:
                description: |-
                  TargetCluster identifies where the resources live: SCPC name (for remote)
                  or "local".
                type: string
              wkr:
                description: |-
                  WKR is "<readyWorkers>/<declaredWorkers>" — surfaced as the
                  WKR printer column (e.g. "0/2").
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
