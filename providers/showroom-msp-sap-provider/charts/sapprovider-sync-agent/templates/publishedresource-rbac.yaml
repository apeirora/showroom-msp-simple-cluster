{{- if .Values.publishedResources.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-syncagent:sapprovider
  labels:
    app.kubernetes.io/name: sapprovider-sync-agent
    app.kubernetes.io/component: portal-integration
rules:
  - apiGroups:
      - sap.gardener
    resources:
      - openstackshoots
      - openstackshoots/status
      - ironcoreshoots
      - ironcoreshoots/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # IronCoreVM CRs served by simple-cluster-operator-ironcore.
  - apiGroups:
      - ironcore.apeirora.eu
    resources:
      - ironcorevms
      - ironcorevms/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Read the kubeconfig Secret written by the operator (related 'service').
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  {{- if .Values.publishedResources.clientKubeconfig.enabled }}
  # Sync the client-kubeconfig related Secret (kubeconfig source 'kcp').
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-syncagent:sapprovider
  labels:
    app.kubernetes.io/name: sapprovider-sync-agent
    app.kubernetes.io/component: portal-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-syncagent:sapprovider
subjects:
  - kind: ServiceAccount
    name: {{ .Values.publishedResources.serviceAccountName | default .Release.Name }}
    namespace: {{ .Values.publishedResources.namespace | default .Release.Namespace }}
{{- end }}
