            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
          type: string
        metadata:
          type: object
        spec:
          description: |-
            Spec is a plain Gardener Shoot manifest, as free text, used verbatim for
