                    format: date-time
                    type: string
                  message:
                    description: 'message is a human readable message indicating details
                      about the transition.

                      This may be an empty string.'
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: 'observedGeneration represents the .metadata.generation
                      that the condition was set based upon.

                      For instance, if .metadata.generation is currently 12, but the
                      .status.conditions[x].observedGeneration is 9, the condition
                      is out of date

                      with respect to the current state of the instance.'
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: 'reason contains a programmatic identifier indicating
                      the reason for the condition''s last transition.

                      Producers of specific condition types may define expected values
                      and meanings for this field,

                      and whether the values are considered a guaranteed API.

                      The value should be a CamelCase string.

                      This field may not be empty.'
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - 'True'
                    - 'False'
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            kubeconfigExpires:
              description: |-
                KubeconfigExpires is when the minted admin kubeconfig expires; the
                operator renews it ahead of this time.
              format: date-time
              type: string
            kubeconfigSecretRef:
              description: |-
                KubeconfigSecretRef names the Secret (next to this CR) holding the admin
                kubeconfig for the provisioned cluster.
              properties:
                name:
                  type: string
              required:
              - name
              type: object
            observedGeneration:
              format: int64
              type: integer
            phase:
              description: |-
                Phase mirrors the Gardener Shoot lifecycle: Provisioning, Ready, Failed
                or Deleting.
              type: string
            providerConfigs:
              description: 'ProviderConfigs lists the SimpleClusterProviderConfig
                names created in

                this namespace on behalf of this flavor. SimpleClusters reference
                these

                names via providerConfigRefs.'
              items:
                type: string
              type: array
            shootName:
              description: ShootName is the name of the Gardener Shoot provisioned
                for this CR.
              type: string
          type: object
      type: object
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    subresources:
      status: {}

