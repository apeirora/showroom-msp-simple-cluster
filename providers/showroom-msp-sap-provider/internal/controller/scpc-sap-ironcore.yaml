apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-gardener-ironcore
  labels:
    app.kubernetes.io/name: sap-provider-operator
    app.kubernetes.io/managed-by: sap-provider-operator
spec:
  autoscaling: true
  target:
    namespace: garden-pm-cc-d2
    # kubeconfigSecretRef is overwritten by the operator (global/kcp source).
    kubeconfigSecretRef:
      name: sap-gardener-kubeconfig
      namespace: sap-provider
  inputs:
    - { name: cloudProfile, type: string,   default: ironcore,                    description: "Gardener CloudProfile name" }
    - { name: region,       type: string,   default: wdf4,                        description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.34.5",                    description: "Kubernetes version" }
    - { name: machineType,  from: profile,                                        description: "Worker machine type; auto-picked as the smallest profile fitting the SC's requested cpu/memory" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: wdf4a,                       description: "Availability zone for the worker pool" }
  # Machine types from the ironcore CloudProfile.
  profiles:
    - { name: memory-intel1-1cpu, cpu: "1", memory: 8Gi }
    - { name: memory-intel1-2cpu, cpu: "2", memory: 16Gi }
  resources:
    - name: shoot
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      nameTemplate: '{{- printf "%s/%s" .SC.namespace .SC.name | sha256sum | trunc 8 | printf "sc-%s" }}'
      deletionAnnotations:
        confirmation.gardener.cloud/deletion: "true"
      readiness:
        phasePath: status.lastOperation.state
        phaseReadyValue: Succeeded
        phaseFailedValues:
          - Failed
          - Error
        lastOperationPath: status.lastOperation.description
        lastErrorPath: status.lastErrors[0].description
      template: |
        apiVersion: core.gardener.cloud/v1beta1
        kind: Shoot
        spec:
          cloudProfile:
            name: {{ .Inputs.cloudProfile }}
            kind: CloudProfile
          credentialsBindingName: my-ironcore-secret
          region: {{ .Inputs.region }}
          kubernetes:
            version: "{{ .Inputs.k8sVersion }}"
          addons:
            nginxIngress:
              enabled: true
              loadBalancerSourceRanges:
                - 0.0.0.0/0
          provider:
            type: ironcore
            workers:
              - name: worker-main
                minimum: {{ .SC.workers.min }}
                maximum: {{ .SC.workers.max }}
                machine:
                  type: {{ .Inputs.machineType }}
                  image:
                    name: {{ .Inputs.machineImage }}
                zones:
                  - {{ .Inputs.zone }}
          networking:
            type: calico
            nodes: 10.250.0.0/16
            pods: 100.64.0.0/12
            services: 100.104.0.0/13
  kubeconfigSource:
    resourceName: shoot
    subResource:
      apiVersion: authentication.gardener.cloud/v1alpha1
      kind: AdminKubeconfigRequest
      subResource: adminkubeconfig
      kubeconfigPath: status.kubeconfig
      expirationPath: status.expirationTimestamp
    # Gardener caps AdminKubeconfigRequest expiration at ~24h; requesting a
    # longer validity with renewalBefore above the cap causes a perpetual
    # re-mint loop in the simple-cluster operator.
    validity: 24h
    renewalBefore: 4h
