apiVersion: v2
name: arsysprovider-pm-integration
description: >-
  Platform Mesh marketplace metadata (APIExport/ProviderMetadata/bind RBAC) for
  the Arsys provider, applied in the KCP control plane. The APIExport carries
  no synced resources; binding it in an account workspace is the signal the
  Arsys operator watches to materialise the `arsys-virtual`
  SimpleClusterProviderConfig.
type: application
version: 0.1.0
appVersion: 0.1.0
