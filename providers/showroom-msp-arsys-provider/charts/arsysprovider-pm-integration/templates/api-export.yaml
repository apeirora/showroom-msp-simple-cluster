apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: arsys
  labels:
    # Marketplace/ContentConfigurations virtual-workspace filters on content-for
    # = APIExport name. Must match `arsys` verbatim.
    ui.platform-mesh.io/content-for: arsys
spec:
  # No resources are synced: binding this export is purely the marketplace signal
  # the Arsys operator watches to create the SCPC in the account namespace.
  resources: []
