apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: arsys
  labels:
    # Marketplace/ContentConfigurations virtual-workspace filters on content-for
    # = APIExport name. Must match `arsys` verbatim.
    ui.platform-mesh.io/content-for: arsys
spec:
  # Binding this export is the marketplace signal the Arsys operator watches
  # to create the SCPC in the account namespace; it additionally exposes the
  # ArsysUbuntuMachine API, synced by arsysprovider-sync-agent.
  resources:
    - group: arsys.apeirora.eu
      name: arsysubuntumachines
      schema: {{ .Values.schemaRevision }}.arsysubuntumachines.arsys.apeirora.eu
      storage:
        crd: {}
  permissionClaims:
    # The syncagent mirrors namespaces and Events between KCP and the MSP cluster.
    - group: ""
      resource: namespaces
      verbs: ["*"]
    - group: ""
      resource: events
      verbs: ["*"]
    # Reserved for a future bring-your-own-credentials path: a workspace
    # Secret referenced from a flavor CR would be mirrored down to the MSP side.
    - group: ""
      resource: secrets
      verbs: ["*"]
