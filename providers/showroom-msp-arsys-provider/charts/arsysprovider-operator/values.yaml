image:
  repository: ghcr.io/apeirora/arsys-provider-operator
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

leaderElect: true

extraEnv: []

# The NamespaceReconciler is the sole creator of the Arsys SCPC. It watches
# account namespaces and materialises the SCPC once the bind-watcher annotation
# shows both APIExports below are bound to the account.
exports:
  simpleClusterExportName: simpleclusters.showroom.apeirora.eu
  providerExportName: arsys

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
