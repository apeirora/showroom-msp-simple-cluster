apiVersion: v1
kind: ServiceAccount
metadata:
  name: arsys-provider-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arsysprovider-operator.labels" . | nindent 4 }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{- range .Values.imagePullSecrets }}
  - name: {{ .name }}
{{- end }}
{{- end }}
