apiVersion: apps/v1
kind: Deployment
metadata:
  name: arsys-provider-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arsysprovider-operator.labels" . | nindent 4 }}
    control-plane: arsys-provider-controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: arsys-provider-controller-manager
  strategy: {}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "arsysprovider-operator.labels" . | nindent 8 }}
        control-plane: arsys-provider-controller-manager
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - name: manager
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.leaderElect }}
            - --simplecluster-export-name={{ .Values.exports.simpleClusterExportName }}
            - --provider-export-name={{ .Values.exports.providerExportName }}
          {{- if .Values.extraEnv }}
          env:
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      serviceAccountName: arsys-provider-controller-manager
      terminationGracePeriodSeconds: 10
