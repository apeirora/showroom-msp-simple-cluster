apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: cloudferro
  labels:
    # Marketplace/ContentConfigurations virtual-workspace filters on content-for
    # = APIExport name. Must match `cloudferro` verbatim.
    ui.platform-mesh.io/content-for: cloudferro
spec:
  # Binding this export is the marketplace signal the CloudFerro operator
  # watches to create the SCPC in the account namespace; it additionally
  # exposes the OpenStackVM API, synced by cloudferroprovider-sync-agent.
  resources:
    - group: openstack.apeirora.eu
      name: openstackvms
      schema: {{ .Values.schemaRevision }}.openstackvms.openstack.apeirora.eu
      storage:
        crd: {}
  permissionClaims:
    # The syncagent mirrors namespaces and Events between KCP and the MSP cluster.
    - group: ""
      resource: namespaces
      verbs: ["*"]
    - group: ""
      resource: events
      verbs: ["*"]
    # Reserved for a future bring-your-own-credentials path: a workspace
    # Secret referenced from a flavor CR would be mirrored down to the MSP side.
    - group: ""
      resource: secrets
      verbs: ["*"]
