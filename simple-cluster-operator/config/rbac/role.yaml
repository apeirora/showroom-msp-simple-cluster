---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs
  - simpleclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs/finalizers
  - simpleclusters/finalizers
  verbs:
  - update
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs/status
  - simpleclusters/status
  verbs:
  - get
  - patch
  - update
