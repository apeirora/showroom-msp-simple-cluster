---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arsys.eu
  - authentication.gardener.cloud
  - core.gardener.cloud
  - kind.apeirora.eu
  - openstack.apeirora.eu
  - sshkeys.apeirora.eu
  - ubuntu.apeirora.eu
  - ubuntumachines.apeirora.eu
  resources:
  - '*'
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs
  - simpleclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs/finalizers
  - simpleclusters/finalizers
  verbs:
  - update
- apiGroups:
  - showroom.apeirora.eu
  resources:
  - simpleclusterproviderconfigs/status
  - simpleclusters/status
  verbs:
  - get
  - patch
  - update
