apiVersion: showroom.apeirora.eu/v1alpha1
kind: SimpleClusterProviderConfig
metadata:
  name: sap-ironcore
  labels:
    app.kubernetes.io/name: simple-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  target:
    namespace: garden-pm-cc-d2
    # NOTE: on msp03 the original Gardener CR pointed at
    # default/gardener-sap-kubeconfig which does not exist. Pointing at the
    # same simple-shoot/gardener-sap-kubeconfig used by sap-openstack since
    # both target garden-pm-cc-d2 on the same Gardener API.
    kubeconfigSecretRef:
      name: gardener-sap-kubeconfig
      namespace: simple-shoot
  inputs:
    - { name: cloudProfile, type: string,   default: ironcore,                    description: "Gardener CloudProfile name" }
    - { name: region,       type: string,   default: wdf4,                        description: "Cloud region" }
    - { name: k8sVersion,   type: string,   default: "1.34.5",                    description: "Kubernetes version" }
    - { name: machineType,  type: string,   default: x3-standard-4,               description: "Worker machine type from the CloudProfile (verify name against the cluster's CloudProfile)" }
    - { name: machineImage, type: string,   default: gardenlinux,                 description: "Worker OS image name" }
    - { name: zone,         type: string,   default: wdf4-a,                      description: "Availability zone for the worker pool" }
  resources:
    - name: shoot
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      namePrefix: ic
      deletionAnnotations:
        confirmation.gardener.cloud/deletion: "true"
      readiness:
        phasePath: status.lastOperation.state
        phaseReadyValue: Succeeded
        phaseFailedValues:
          - Failed
          - Error
        lastOperationPath: status.lastOperation.description
        lastErrorPath: status.lastErrors[0].description
      template: |
        apiVersion: core.gardener.cloud/v1beta1
        kind: Shoot
        spec:
          cloudProfile:
            name: {{ .Inputs.cloudProfile }}
            kind: CloudProfile
          credentialsBindingName: my-ironcore-secret
          region: {{ .Inputs.region }}
          kubernetes:
            version: "{{ .Inputs.k8sVersion }}"
          provider:
            type: ironcore
            workers:
              - name: worker-main
                minimum: 1
                maximum: {{ .SC.workers }}
                machine:
                  type: {{ .Inputs.machineType }}
                  image:
                    name: {{ .Inputs.machineImage }}
                zones:
                  - {{ .Inputs.zone }}
          networking:
            type: calico
            nodes: 10.250.0.0/16
            pods: 100.64.0.0/12
            services: 100.104.0.0/13
  kubeconfigSource:
    resourceName: shoot
    subResource:
      apiVersion: authentication.gardener.cloud/v1alpha1
      kind: AdminKubeconfigRequest
      subResource: adminkubeconfig
      kubeconfigPath: status.kubeconfig
      expirationPath: status.expirationTimestamp
    validity: 720h
    renewalBefore: 72h
